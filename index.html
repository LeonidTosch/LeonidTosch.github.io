<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kikoriki Chase: Kopatych's Rampage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #2c3e50; /* Dark background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* Prevent default touch actions on canvas */
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #uiOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none; /* Let clicks pass through to canvas */
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
        }
        .score-box {
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 10px 20px;
            border-radius: 15px;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #messageScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(44, 62, 80, 0.9);
            color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            pointer-events: auto;
            z-index: 20;
            border: 4px solid #f39c12;
        }
        #messageScreen h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #f1c40f;
            text-shadow: 2px 2px 4px #000;
        }
        #messageScreen p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        .btn {
            background: linear-gradient(to bottom, #f39c12, #d35400);
            border: none;
            color: white;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 5px 0 #b33c00;
        }
        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #b33c00;
        }
        /* Controls for mobile */
        #mobileControls {
             display: none;
             position: absolute;
             bottom: 20px;
             left: 20px;
             pointer-events: auto;
             z-index: 10;
        }
        @media (max-width: 768px) {
            #mobileControls {
                display: block;
            }
        }
        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 5px;
        }
        .d-pad-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }
        .d-pad-btn:active {
            background: rgba(255,255,255,0.5);
        }
        .up { grid-column: 2; grid-row: 1; }
        .left { grid-column: 1; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }
        .down { grid-column: 2; grid-row: 3; }

    </style>
</head>
<body>

    <div id="uiOverlay">
        <div class="score-box">Enemies Left: <span id="enemiesCount">0</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="messageScreen">
        <h1 id="screenTitle">Kopatych's Rampage</h1>
        <p id="screenSubtitle">Control the Bear (Kopatych) and catch all the others!</p>
        <p style="font-size: 0.9rem; color: #ccc;">Use Arrow Keys / WASD to move.</p>
        <button class="btn" id="startBtn" onclick="startGame()">Start Game</button>
    </div>

    <div id="mobileControls">
        <div class="d-pad">
            <div class="d-pad-btn up" id="btnUp">▲</div>
            <div class="d-pad-btn left" id="btnLeft">◀</div>
            <div class="d-pad-btn right" id="btnRight">▶</div>
            <div class="d-pad-btn down" id="btnDown">▼</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const enemiesCountSpan = document.getElementById('enemiesCount');
        const messageScreen = document.getElementById('messageScreen');
        const screenTitle = document.getElementById('screenTitle');
        const screenSubtitle = document.getElementById('screenSubtitle');
        const startBtn = document.getElementById('startBtn');

        let width, height;
        let animationId;
        let gameState = 'START'; // START, PLAYING, GAME_OVER, WIN

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // Game Settings
        const BEAR_SPEED = 4;
        const ENEMY_SPEED = 2;
        const FRICTION = 0.8;
        const ACCELERATION = 1.5;

        // Characters based on Kikoriki (Smeshariki) colors
        // Kopatych (Bear) - Player
        const kopatych = {
            x: 0, y: 0, radius: 25, color: '#A0522D', // Sienna / Brown
            vx: 0, vy: 0,
            draw: function() {
                // Body
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#5c2d13';
                ctx.stroke();

                // Eyes
                ctx.fillStyle = 'white';
                ctx.beginPath(); ctx.arc(this.x - 8, this.y - 5, 6, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(this.x + 8, this.y - 5, 6, 0, Math.PI*2); ctx.fill();
                // Pupils (Angry)
                ctx.fillStyle = 'black';
                ctx.beginPath(); ctx.arc(this.x - 6, this.y - 3, 2, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(this.x + 6, this.y - 3, 2, 0, Math.PI*2); ctx.fill();
                
                // Eyebrows
                ctx.beginPath(); ctx.moveTo(this.x - 15, this.y - 15); ctx.lineTo(this.x - 2, this.y - 8); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(this.x + 15, this.y - 15); ctx.lineTo(this.x + 2, this.y - 8); ctx.stroke();

                // Nose
                ctx.fillStyle = '#4a2311';
                ctx.beginPath(); ctx.arc(this.x, this.y + 5, 8, 0, Math.PI*2); ctx.fill();
            }
        };

        const enemyTemplates = [
            { name: 'Krash', color: '#00BFFF', type: 'rabbit' }, // DeepSkyBlue
            { name: 'Chiko', color: '#FF69B4', type: 'pig' },     // HotPink
            { name: 'Wally', color: '#9370DB', type: 'ram' },     // MediumPurple
            { name: 'Pin', color: '#000000', type: 'penguin' },   // Black/White
            { name: 'Dokko', color: '#FFA500', type: 'moose' },   // Orange
            { name: 'Rosa', color: '#FFC0CB', type: 'pig' }       // Pink
        ];

        let enemies = [];
        let particles = [];

        class Enemy {
            constructor(x, y, template) {
                this.x = x;
                this.y = y;
                this.radius = 20;
                this.color = template.color;
                this.name = template.name;
                this.type = template.type;
                // Random movement direction
                this.angle = Math.random() * Math.PI * 2;
                this.speed = ENEMY_SPEED + Math.random();
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
                // Change direction timer
                this.changeDirTimer = 0;
            }

            update() {
                // Wandering logic
                this.changeDirTimer++;
                if (this.changeDirTimer > 60 + Math.random() * 60) {
                    this.angle += (Math.random() - 0.5) * Math.PI; // Change angle slightly
                    this.vx = Math.cos(this.angle) * this.speed;
                    this.vy = Math.sin(this.angle) * this.speed;
                    this.changeDirTimer = 0;
                }

                // Fleeing logic (if bear is close)
                const distToBear = Math.hypot(kopatych.x - this.x, kopatych.y - this.y);
                if (distToBear < 200) {
                    const fleeAngle = Math.atan2(this.y - kopatych.y, this.x - kopatych.x);
                    this.vx = Math.cos(fleeAngle) * (this.speed * 1.5);
                    this.vy = Math.sin(fleeAngle) * (this.speed * 1.5);
                }

                this.x += this.vx;
                this.y += this.vy;

                // Bounce off walls
                if (this.x < this.radius) { this.x = this.radius; this.vx *= -1; }
                if (this.x > width - this.radius) { this.x = width - this.radius; this.vx *= -1; }
                if (this.y < this.radius) { this.y = this.radius; this.vy *= -1; }
                if (this.y > height - this.radius) { this.y = height - this.radius; this.vy *= -1; }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#333';
                ctx.stroke();

                // Simple eyes (scared)
                ctx.fillStyle = 'white';
                ctx.beginPath(); ctx.arc(this.x - 6, this.y - 4, 5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(this.x + 6, this.y - 4, 5, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'black';
                ctx.beginPath(); ctx.arc(this.x - 6, this.y - 4, 1.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(this.x + 6, this.y - 4, 1.5, 0, Math.PI*2); ctx.fill();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.radius = Math.random() * 4 + 2;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1.0;
                this.decay = Math.random() * 0.05 + 0.02;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }
            draw() {
                ctx.globalAlpha = this.life;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        const keys = {
            ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false,
            w: false, a: false, s: false, d: false
        };

        window.addEventListener('keydown', (e) => {
            if(keys.hasOwnProperty(e.key)) keys[e.key] = true;
        });
        window.addEventListener('keyup', (e) => {
            if(keys.hasOwnProperty(e.key)) keys[e.key] = false;
        });

        // Mobile touch controls
        function addTouchControl(btnId, keyName) {
            const btn = document.getElementById(btnId);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; }, {passive: false});
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; }, {passive: false});
        }
        addTouchControl('btnUp', 'ArrowUp');
        addTouchControl('btnDown', 'ArrowDown');
        addTouchControl('btnLeft', 'ArrowLeft');
        addTouchControl('btnRight', 'ArrowRight');


        function createExplosion(x, y, color) {
            for (let i = 0; i < 20; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function startGame() {
            gameState = 'PLAYING';
            messageScreen.style.display = 'none';
            
            // Reset Player
            kopatych.x = width / 2;
            kopatych.y = height / 2;
            kopatych.vx = 0;
            kopatych.vy = 0;

            // Spawn Enemies
            enemies = [];
            particles = [];
            
            // Create 10 enemies randomly selecting from templates
            for (let i = 0; i < 10; i++) {
                let template = enemyTemplates[Math.floor(Math.random() * enemyTemplates.length)];
                let ex, ey;
                // Ensure they don't spawn right on top of the player
                do {
                    ex = Math.random() * (width - 100) + 50;
                    ey = Math.random() * (height - 100) + 50;
                } while (Math.hypot(kopatych.x - ex, kopatych.y - ey) < 150);
                
                enemies.push(new Enemy(ex, ey, template));
            }

            updateUI();
            if (animationId) cancelAnimationFrame(animationId);
            gameLoop();
        }

        function updateUI() {
            enemiesCountSpan.innerText = enemies.length;
        }

        function endGame(isWin) {
            gameState = isWin ? 'WIN' : 'GAME_OVER';
            messageScreen.style.display = 'block';
            if (isWin) {
                screenTitle.innerText = "You Caught Them All!";
                screenTitle.style.color = "#2ecc71"; // Green
                screenSubtitle.innerText = "The rampage is over.";
                startBtn.innerText = "Play Again";
            }
        }

        function updatePlayer() {
            // Acceleration based on input
            if (keys.ArrowUp || keys.w) kopatych.vy -= ACCELERATION;
            if (keys.ArrowDown || keys.s) kopatych.vy += ACCELERATION;
            if (keys.ArrowLeft || keys.a) kopatych.vx -= ACCELERATION;
            if (keys.ArrowRight || keys.d) kopatych.vx += ACCELERATION;

            // Apply friction
            kopatych.vx *= FRICTION;
            kopatych.vy *= FRICTION;

            // Limit max speed
            const speed = Math.hypot(kopatych.vx, kopatych.vy);
            if (speed > BEAR_SPEED * 2) {
                kopatych.vx = (kopatych.vx / speed) * (BEAR_SPEED * 2);
                kopatych.vy = (kopatych.vy / speed) * (BEAR_SPEED * 2);
            }

            kopatych.x += kopatych.vx;
            kopatych.y += kopatych.vy;

            // Boundary collision
            if (kopatych.x < kopatych.radius) kopatych.x = kopatych.radius;
            if (kopatych.x > width - kopatych.radius) kopatych.x = width - kopatych.radius;
            if (kopatych.y < kopatych.radius) kopatych.y = kopatych.radius;
            if (kopatych.y > height - kopatych.radius) kopatych.y = height - kopatych.radius;
        }

        function gameLoop() {
            if (gameState !== 'PLAYING') return;

            // Clear canvas
            ctx.fillStyle = '#87CEEB'; // Sky blue background for the field
            ctx.fillRect(0, 0, width, height);

            // Draw some basic grass pattern
            ctx.fillStyle = '#228B22'; // Forest green
            for(let i=0; i<20; i++) {
                ctx.beginPath();
                ctx.arc((i*137)%width, (i*211)%height, 40, 0, Math.PI*2);
                ctx.fill();
            }

            updatePlayer();
            kopatych.draw();

            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update();
                p.draw();
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Update and draw enemies, check collisions
            for (let i = enemies.length - 1; i >= 0; i--) {
                let enemy = enemies[i];
                enemy.update();
                enemy.draw();

                // Collision detection (Player vs Enemy)
                const dist = Math.hypot(kopatych.x - enemy.x, kopatych.y - enemy.y);
                if (dist < kopatych.radius + enemy.radius) {
                    // Enemy caught
                    createExplosion(enemy.x, enemy.y, enemy.color);
                    enemies.splice(i, 1);
                    updateUI();
                }
            }

            // Check Win Condition
            if (enemies.length === 0) {
                endGame(true);
                return; // Stop rendering this frame
            }

            animationId = requestAnimationFrame(gameLoop);
        }

        // Draw initial static screen
        ctx.fillStyle = '#2c3e50';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

    </script>
</body>
</html>
