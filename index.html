<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geometry Dash 3D Epic</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* Prevent browser handling of gestures */
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to game */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        
        /* UI Screens */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.1);
            pointer-events: auto;
            text-align: center;
            max-width: 90vw;
        }
        
        .screen.active {
            display: flex;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            font-size: 4rem;
            margin: 0 0 20px 0;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(79, 172, 254, 0.5));
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h2 {
            font-size: 2.5rem;
            margin: 0 0 20px 0;
            color: #fff;
        }

        .level-name {
            font-size: 1.5rem;
            color: #ccc;
            margin-bottom: 30px;
        }

        button {
            background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            color: white;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(255, 8, 68, 0.4);
            margin: 10px;
        }

        button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 8, 68, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }
        
        button.secondary {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            box-shadow: 0 5px 15px rgba(67, 233, 123, 0.4);
        }
        
        button.secondary:hover {
            box-shadow: 0 8px 25px rgba(67, 233, 123, 0.6);
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 1.5rem;
            font-weight: bold;
            pointer-events: none;
            z-index: 5;
        }

        #progress-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 50%;
            height: 10px;
            background: rgba(255,255,255,0.2);
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.3);
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            transition: width 0.1s linear;
            box-shadow: 0 0 10px #00f2fe;
        }
        
        .level-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .level-btn {
            padding: 15px;
            font-size: 1.2rem;
            min-width: 60px;
        }
        
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .level-grid { grid-template-columns: repeat(3, 1fr); }
            button { padding: 10px 20px; font-size: 1.2rem; }
        }
    </style>
    <!-- Load Three.js and Post-Processing Addons -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>
    <div id="game-container"></div>
    
    <div id="ui-layer">
        <!-- Main Menu -->
        <div id="menu-screen" class="screen active">
            <h1>Neon Dash</h1>
            <p style="margin-bottom: 20px; color: #aaa;">Click, Space, or Touch to Jump</p>
            <button id="btn-start">Play Level 1</button>
            <button id="btn-levels" class="secondary" style="margin-top: 10px;">Select Level</button>
        </div>

        <!-- Level Select Menu -->
        <div id="level-select-screen" class="screen">
            <h2>Select Level</h2>
            <div class="level-grid" id="level-grid-container">
                <!-- Buttons generated by JS -->
            </div>
            <button id="btn-back-menu" class="secondary">Back</button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="screen">
            <h1 style="color: #ff0844; filter: drop-shadow(0 0 10px rgba(255,8,68,0.5));">Attempt Failed</h1>
            <p id="death-stats" style="margin-bottom: 20px; font-size: 1.2rem;"></p>
            <button id="btn-restart">Try Again</button>
            <button id="btn-menu" class="secondary">Menu</button>
        </div>

        <!-- Level Complete Screen -->
        <div id="complete-screen" class="screen">
            <h1 style="color: #43e97b; filter: drop-shadow(0 0 10px rgba(67,233,123,0.5));">Level Complete!</h1>
            <p id="complete-stats" style="margin-bottom: 20px; font-size: 1.2rem;"></p>
            <button id="btn-next-level">Next Level</button>
            <button id="btn-menu-win" class="secondary">Menu</button>
        </div>
    </div>

    <div id="hud" style="display: none;">
        <span id="attempts-hud">Attempt: 1</span>
        <span id="level-hud">Level 1</span>
    </div>
    
    <div id="progress-container" style="display: none;">
        <div id="progress-bar"></div>
    </div>

    <script>
        // --- Game State & Constants ---
        const GameState = {
            MENU: 0,
            PLAYING: 1,
            GAMEOVER: 2,
            COMPLETE: 3,
            LEVEL_SELECT: 4
        };

        const config = {
            playerSpeed: 15,
            jumpForce: 18,
            gravity: 60,
            playerSize: 1,
            groundY: 0,
            cubeColor: 0x00f2fe,
            totalLevels: 10,
            cameraOffset: { x: -6, y: 4, z: 12 }, // Isometric-ish view
            lookAtOffset: { x: 5, y: 2, z: 0 }
        };

        let state = GameState.MENU;
        let currentLevel = 1;
        let attempts = 1;
        let progress = 0;
        let lastTime = 0;
        
        // --- Three.js Variables ---
        let scene, camera, renderer, composer, bloomPass;
        let playerMesh, playerTrail;
        let groundMesh, backgroundGrid;
        let obstacles = [];
        let particles = [];
        let levelLength = 0;
        let floorMirror;
        
        // Physics/Movement state
        let playerVelocityY = 0;
        let isGrounded = true;
        let playerRotation = 0;
        let targetRotation = 0;
        
        // Colors
        const colors = {
            neonBlue: 0x00f2fe,
            neonPink: 0xff0844,
            neonGreen: 0x43e97b,
            neonPurple: 0xb53cff,
            neonYellow: 0xfff000,
            darkBg: 0x050510
        };

        // Level Design Themes
        const levelThemes = [
            { bg: 0x050515, ground: 0x111122, obstacle: colors.neonBlue, bloom: 1.5, emissive: 0.8 }, // Lvl 1: Intro Blue
            { bg: 0x150505, ground: 0x221111, obstacle: colors.neonPink, bloom: 1.8, emissive: 1.0 }, // Lvl 2: Aggressive Pink
            { bg: 0x051505, ground: 0x112211, obstacle: colors.neonGreen, bloom: 1.5, emissive: 0.8 }, // Lvl 3: Toxic Green
            { bg: 0x150515, ground: 0x221122, obstacle: colors.neonPurple, bloom: 2.0, emissive: 1.2 }, // Lvl 4: Deep Purple
            { bg: 0x151505, ground: 0x222211, obstacle: colors.neonYellow, bloom: 1.5, emissive: 0.9 }, // Lvl 5: Electric Yellow
            { bg: 0x000000, ground: 0x111111, obstacle: 0xffffff, bloom: 2.5, emissive: 1.5 },         // Lvl 6: Mono Intense
            { bg: 0x050520, ground: 0x111133, obstacle: 0x00ffff, bloom: 1.8, emissive: 1.0 },         // Lvl 7: Cyan Depth
            { bg: 0x200505, ground: 0x331111, obstacle: 0xff4400, bloom: 2.0, emissive: 1.2 },         // Lvl 8: Lava Red
            { bg: 0x200520, ground: 0x331133, obstacle: 0xff00ff, bloom: 2.2, emissive: 1.3 },         // Lvl 9: Magenta Void
            { bg: 0x052020, ground: 0x113333, obstacle: 0x00ffaa, bloom: 3.0, emissive: 1.5 }          // Lvl 10: Epic Finale
        ];

        // --- DOM Elements ---
        const uiMenu = document.getElementById('menu-screen');
        const uiLevelSelect = document.getElementById('level-select-screen');
        const uiGameOver = document.getElementById('gameover-screen');
        const uiComplete = document.getElementById('complete-screen');
        const hud = document.getElementById('hud');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        
        function initThreeJS() {
            const container = document.getElementById('game-container');
            
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(levelThemes[0].bg);
            scene.fog = new THREE.FogExp2(levelThemes[0].bg, 0.02);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Cap pixel ratio for performance
            
            // Shadows (expensive, keep simple)
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            
            container.appendChild(renderer.domElement);

            // --- Post Processing (Bloom for Neon effect) ---
            const renderScene = new THREE.RenderPass(scene, camera);
            
            // Resolution, strength, radius, threshold
            bloomPass = new THREE.UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight), 
                1.5, 0.4, 0.1
            );
            
            composer = new THREE.EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            // --- Lights ---
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(-10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.camera.left = -30;
            dirLight.shadow.camera.right = 30;
            dirLight.shadow.camera.top = 10;
            dirLight.shadow.camera.bottom = -10;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);
            
            // A moving point light attached to player later
            playerLight = new THREE.PointLight(config.cubeColor, 2, 20);
            scene.add(playerLight);

            // --- Window Resize ---
            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function createGameObjects() {
            // 1. Player Cube
            const geometry = new THREE.BoxGeometry(config.playerSize, config.playerSize, config.playerSize);
            // Multi-material for epic look: Emissive edges, dark core
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x111111,
                emissive: config.cubeColor,
                emissiveIntensity: 0.5,
                roughness: 0.2,
                metalness: 0.8
            });
            playerMesh = new THREE.Mesh(geometry, material);
            playerMesh.castShadow = true;
            scene.add(playerMesh);

            // Wireframe outer box for extra glow
            const wireframeGeo = new THREE.EdgesGeometry(geometry);
            const wireframeMat = new THREE.LineBasicMaterial({ color: config.cubeColor, linewidth: 2 });
            const wireframe = new THREE.LineSegments(wireframeGeo, wireframeMat);
            playerMesh.add(wireframe);
            
            // Trail particles system (simple implementation)
            playerTrail = [];

            // 2. The Ground / Run path
            const groundGeo = new THREE.PlaneGeometry(1000, 20);
            // Simulated reflection using a glossy material
            const groundMat = new THREE.MeshStandardMaterial({ 
                color: levelThemes[0].ground,
                roughness: 0.1, // Shiny
                metalness: 0.5,
            });
            groundMesh = new THREE.Mesh(groundGeo, groundMat);
            groundMesh.rotation.x = -Math.PI / 2;
            groundMesh.position.y = config.groundY;
            groundMesh.position.x = 490; // Extend forward
            groundMesh.receiveShadow = true;
            scene.add(groundMesh);

            // 3. Background Grid (Synthwave style)
            const gridHelper = new THREE.GridHelper(1000, 100, 0x333333, 0x111111);
            gridHelper.position.y = config.groundY - 0.1;
            gridHelper.position.x = 490;
            scene.add(gridHelper);
            backgroundGrid = gridHelper;
            
            // Add some floating background particles
            createBackgroundParticles();
        }
        
        function createBackgroundParticles() {
            const particleGeo = new THREE.BufferGeometry();
            const particleCount = 500;
            const posArray = new Float32Array(particleCount * 3);
            
            for(let i=0; i < particleCount * 3; i+=3) {
                posArray[i] = Math.random() * 500 - 50; // x: along path
                posArray[i+1] = Math.random() * 40 - 10; // y: height
                posArray[i+2] = Math.random() * 100 - 50; // z: depth
            }
            
            particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particleMat = new THREE.PointsMaterial({
                size: 0.5,
                color: 0xffffff,
                transparent: true,
                opacity: 0.3,
                blending: THREE.AdditiveBlending
            });
            
            bgParticles = new THREE.Points(particleGeo, particleMat);
            scene.add(bgParticles);
        }

        function generateLevel(levelNum) {
            // Clear old obstacles
            obstacles.forEach(obs => scene.remove(obs));
            obstacles = [];
            
            // Update Theme
            const themeIdx = (levelNum - 1) % levelThemes.length;
            const theme = levelThemes[themeIdx];
            
            scene.background.setHex(theme.bg);
            scene.fog.color.setHex(theme.bg);
            groundMesh.material.color.setHex(theme.ground);
            bloomPass.strength = theme.bloom;
            
            // Update Player color
            playerMesh.material.emissive.setHex(theme.obstacle);
            playerMesh.children[0].material.color.setHex(theme.obstacle);
            playerLight.color.setHex(theme.obstacle);

            // Level parameters based on difficulty
            // Level length increases slightly, density increases, patterns change
            const baseLength = 200;
            levelLength = baseLength + (levelNum * 30);
            
            // Pattern generation
            let currentX = 20; // Safe start zone
            const gapMin = 10 - (levelNum * 0.3); // Gaps get smaller
            const gapMax = 20 - (levelNum * 0.5);
            
            const obstacleMaterial = new THREE.MeshStandardMaterial({
                color: 0x111111,
                emissive: theme.obstacle,
                emissiveIntensity: theme.emissive,
                roughness: 0.2,
                metalness: 0.8
            });

            // Materials for different hazard types
            const spikeMaterial = obstacleMaterial.clone();
            const blockMaterial = obstacleMaterial.clone();
            const slabMaterial = obstacleMaterial.clone();

            while (currentX < levelLength) {
                // Decide what to place
                const rand = Math.random();
                let gapToNext = Math.random() * (gapMax - gapMin) + gapMin;
                
                // Difficulty multipliers based on level (1-10)
                const difficulty = levelNum / 10; 
                
                if (rand < 0.3 + (difficulty * 0.2)) {
                    // Spikes
                    let numSpikes = 1 + Math.floor(Math.random() * (1 + difficulty * 3));
                    for(let i=0; i<numSpikes; i++) {
                        createSpike(currentX + (i * 1.2), spikeMaterial);
                    }
                    gapToNext += numSpikes * 1.2;
                } 
                else if (rand < 0.6 + (difficulty * 0.1)) {
                    // Block (need to jump on or over)
                    let h = 1 + Math.floor(Math.random() * (1 + difficulty * 2));
                    createBlock(currentX, h, blockMaterial);
                }
                else if (rand < 0.8 && levelNum > 2) {
                    // Elevated platform + spike trap under
                    createPlatform(currentX, 2, 4, slabMaterial);
                    createSpike(currentX + 1, spikeMaterial);
                    gapToNext += 4;
                }
                else if (levelNum > 4) {
                    // Complex pattern: Staircase or double jump needed
                     createBlock(currentX, 1, blockMaterial);
                     createSpike(currentX + 2, spikeMaterial);
                     createBlock(currentX + 4, 2, blockMaterial);
                     gapToNext += 6;
                }

                currentX += Math.max(gapToNext, 5); // Minimum gap to ensure playability
            }
            
            // End Goal Line
            createEndGoal(levelLength, theme.obstacle);
            
            // Move ground to cover level
            groundMesh.scale.x = (levelLength + 100) / 1000;
            groundMesh.position.x = (levelLength + 100) / 2 - 50;
        }

        function createSpike(x, material) {
            // Cone geometry for spike
            const geo = new THREE.ConeGeometry(0.5, 1, 4);
            const mesh = new THREE.Mesh(geo, material);
            mesh.position.set(x, config.groundY + 0.5, 0);
            mesh.rotation.y = Math.PI / 4; // Rotate to look sharper
            mesh.castShadow = true;
            
            // Add wireframe
            const edges = new THREE.EdgesGeometry(geo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: material.emissive }));
            mesh.add(line);

            scene.add(mesh);
            obstacles.push({ mesh: mesh, type: 'spike', x: x, w: 0.6, h: 0.8 }); // Hitbox slightly smaller than visual
        }

        function createBlock(x, height, material) {
            const geo = new THREE.BoxGeometry(1, height, 1);
            const mesh = new THREE.Mesh(geo, material);
            mesh.position.set(x, config.groundY + height/2, 0);
            mesh.castShadow = true;
            
             // Add wireframe
            const edges = new THREE.EdgesGeometry(geo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: material.emissive }));
            mesh.add(line);
            
            scene.add(mesh);
            obstacles.push({ mesh: mesh, type: 'block', x: x, w: 1, h: height, y: config.groundY });
        }
        
        function createPlatform(x, y, length, material) {
            const geo = new THREE.BoxGeometry(length, 0.5, 1);
            const mesh = new THREE.Mesh(geo, material);
            mesh.position.set(x + length/2 - 0.5, config.groundY + y, 0);
            mesh.castShadow = true;
            
             // Add wireframe
            const edges = new THREE.EdgesGeometry(geo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: material.emissive }));
            mesh.add(line);
            
            scene.add(mesh);
            obstacles.push({ mesh: mesh, type: 'platform', x: x + length/2 - 0.5, w: length, h: 0.5, y: config.groundY + y - 0.25 });
        }

        function createEndGoal(x, color) {
            // A towering pillar of light
            const geo = new THREE.CylinderGeometry(1, 1, 20, 16);
            const mat = new THREE.MeshBasicMaterial({ 
                color: color, 
                transparent: true, 
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, config.groundY + 10, 0);
            scene.add(mesh);
            obstacles.push({ mesh: mesh, type: 'goal', x: x, w: 2, h: 100 });
        }

        function jump() {
            if (state !== GameState.PLAYING) {
                if(state === GameState.MENU || state === GameState.GAMEOVER) {
                    // Ignore, buttons handle state changes
                }
                return;
            }

            if (isGrounded) {
                playerVelocityY = config.jumpForce;
                isGrounded = false;
                // Target rotation is next 90 degrees
                targetRotation -= Math.PI / 2;
                createJumpParticles();
            }
        }

        // Input Listeners
        window.addEventListener('mousedown', (e) => {
            // Only jump if clicking on canvas (not UI)
            if(e.target.tagName === 'CANVAS') jump();
        });
        window.addEventListener('touchstart', (e) => {
            if(e.target.tagName === 'CANVAS') {
                e.preventDefault(); // Prevent scrolling
                jump();
            }
        }, {passive: false});
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') jump();
        });

        function checkCollisions() {
            // Player AABB approximation
            const px = playerMesh.position.x;
            const py = playerMesh.position.y;
            const pSize = config.playerSize;
            const halfSize = pSize / 2;
            
            // Hitbox padding for leniency
            const pxMin = px - halfSize + 0.2; 
            const pxMax = px + halfSize - 0.2;
            const pyMin = py - halfSize + 0.1; // Bottom
            const pyMax = py + halfSize - 0.1; // Top

            let onPlatform = false;
            let groundLevel = config.groundY;

            for (let i = 0; i < obstacles.length; i++) {
                const obs = obstacles[i];
                
                // Broad phase filtering - only check nearby obstacles
                if (Math.abs(obs.x - px) > 10) continue;

                if (obs.type === 'goal') {
                    if (px > obs.x) {
                        levelComplete();
                    }
                    continue;
                }

                // Obstacle bounds
                const oxMin = obs.x - obs.w / 2;
                const oxMax = obs.x + obs.w / 2;
                const oyMin = (obs.y !== undefined) ? obs.y : config.groundY;
                const oyMax = oyMin + obs.h;

                // Check overlap
                if (pxMax > oxMin && pxMin < oxMax) {
                    // We are horizontally aligned with object
                    
                    if (obs.type === 'spike') {
                        // Spikes kill if you touch them at all while horizontally aligned
                        if (pyMin < oyMax) {
                            die();
                            return;
                        }
                    } else if (obs.type === 'block' || obs.type === 'platform') {
                        // Box collision
                        if (pyMax > oyMin && pyMin < oyMax) {
                            
                            // Are we landing on top? (Falling, and bottom of player is near top of block)
                            if (playerVelocityY <= 0 && pyMin >= oyMax - 0.4) { // Leniency
                                onPlatform = true;
                                groundLevel = oyMax;
                            } else {
                                // Hit the side or bottom -> Death
                                die();
                                return;
                            }
                        }
                    }
                }
            }

            // Apply ground/platform level
            if (pyMin <= groundLevel && playerVelocityY <= 0) {
                playerMesh.position.y = groundLevel + halfSize;
                playerVelocityY = 0;
                isGrounded = true;
                
                // Snap rotation to nearest 90 deg when landing
                playerRotation = targetRotation;
                playerMesh.rotation.z = playerRotation;
            } else {
                isGrounded = false;
            }
        }

        function createJumpParticles() {
            const count = 10;
            const geo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
            const mat = new THREE.MeshBasicMaterial({ color: playerMesh.material.emissive });
            
            for(let i=0; i<count; i++) {
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.copy(playerMesh.position);
                mesh.position.y -= config.playerSize/2;
                
                scene.add(mesh);
                particles.push({
                    mesh: mesh,
                    life: 1.0,
                    vel: new THREE.Vector3(
                        (Math.random() - 0.5) * 10,
                        Math.random() * 5,
                        (Math.random() - 0.5) * 10
                    )
                });
            }
        }

        function createDeathExplosion() {
            const count = 50;
            const geo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
            const mat = new THREE.MeshBasicMaterial({ color: playerMesh.material.emissive });
            
            for(let i=0; i<count; i++) {
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.copy(playerMesh.position);
                
                scene.add(mesh);
                particles.push({
                    mesh: mesh,
                    life: 1.5,
                    vel: new THREE.Vector3(
                        (Math.random() - 0.5) * 20 + 5, // Inherit some forward momentum
                        (Math.random() - 0.2) * 20,
                        (Math.random() - 0.5) * 20
                    ),
                    rot: new THREE.Vector3(Math.random()*0.2, Math.random()*0.2, Math.random()*0.2)
                });
            }
        }

        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life -= dt;
                
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                } else {
                    p.mesh.position.addScaledVector(p.vel, dt);
                    // Gravity for particles
                    p.vel.y -= 20 * dt;
                    
                    if(p.rot) {
                        p.mesh.rotation.x += p.rot.x;
                        p.mesh.rotation.y += p.rot.y;
                        p.mesh.rotation.z += p.rot.z;
                    }
                    
                    p.mesh.scale.setScalar(p.life);
                }
            }
        }
        
        function updateTrail(dt) {
            // Simple trail logic: leave faint boxes behind
            if(state === GameState.PLAYING && Math.random() < 0.3) {
                 const geo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
                 const mat = new THREE.MeshBasicMaterial({ 
                     color: playerMesh.material.emissive,
                     transparent: true,
                     opacity: 0.3
                 });
                 const mesh = new THREE.Mesh(geo, mat);
                 mesh.position.copy(playerMesh.position);
                 mesh.rotation.copy(playerMesh.rotation);
                 scene.add(mesh);
                 
                 playerTrail.push({ mesh: mesh, life: 0.5 });
            }
            
            for (let i = playerTrail.length - 1; i >= 0; i--) {
                const t = playerTrail[i];
                t.life -= dt;
                if(t.life <= 0) {
                    scene.remove(t.mesh);
                    playerTrail.splice(i, 1);
                } else {
                    t.mesh.scale.setScalar(t.life * 2);
                    t.mesh.material.opacity = t.life * 0.6;
                }
            }
        }

        function startGame(level) {
            currentLevel = level;
            attempts = 1;
            resetLevel();
            switchScreen(null);
            hud.style.display = 'flex';
            progressContainer.style.display = 'block';
            updateHUD();
        }

        function resetLevel() {
            generateLevel(currentLevel);
            
            // Reset Player
            playerMesh.position.set(0, config.groundY + config.playerSize/2, 0);
            playerMesh.visible = true;
            playerVelocityY = 0;
            isGrounded = true;
            playerRotation = 0;
            targetRotation = 0;
            playerMesh.rotation.z = 0;
            
            // Camera reset
            camera.position.set(
                playerMesh.position.x + config.cameraOffset.x,
                playerMesh.position.y + config.cameraOffset.y,
                playerMesh.position.z + config.cameraOffset.z
            );
            
            // Clear specific particles
            particles.forEach(p => scene.remove(p.mesh));
            particles = [];
            playerTrail.forEach(t => scene.remove(t.mesh));
            playerTrail = [];

            state = GameState.PLAYING;
            lastTime = performance.now();
        }

        function die() {
            if (state !== GameState.PLAYING) return;
            state = GameState.GAMEOVER;
            playerMesh.visible = false;
            createDeathExplosion();
            
            // Calculate % complete
            const percent = Math.floor(Math.max(0, Math.min(100, (playerMesh.position.x / levelLength) * 100)));
            document.getElementById('death-stats').innerText = `Level ${currentLevel} - ${percent}% Complete`;
            
            setTimeout(() => {
                hud.style.display = 'none';
                progressContainer.style.display = 'none';
                switchScreen(uiGameOver);
            }, 1000);
        }

        function levelComplete() {
            if (state !== GameState.PLAYING) return;
            state = GameState.COMPLETE;
            
            document.getElementById('complete-stats').innerText = `Attempts: ${attempts}`;
            
            setTimeout(() => {
                hud.style.display = 'none';
                progressContainer.style.display = 'none';
                if (currentLevel < config.totalLevels) {
                    document.getElementById('btn-next-level').style.display = 'inline-block';
                } else {
                    document.getElementById('btn-next-level').style.display = 'none';
                    document.getElementById('complete-stats').innerHTML += "<br><b style='color:#00f2fe'>ALL LEVELS BEATEN! GG!</b>";
                }
                switchScreen(uiComplete);
            }, 500);
        }

        function buildLevelSelect() {
            const container = document.getElementById('level-grid-container');
            container.innerHTML = '';
            for(let i=1; i<=config.totalLevels; i++) {
                const btn = document.createElement('button');
                btn.className = 'level-btn';
                btn.innerText = i;
                
                // Color button based on theme
                const themeIdx = (i - 1) % levelThemes.length;
                const c = new THREE.Color(levelThemes[themeIdx].obstacle);
                btn.style.background = `linear-gradient(135deg, #${c.getHexString()} 0%, #333 100%)`;
                
                btn.onclick = () => startGame(i);
                container.appendChild(btn);
            }
        }

        function switchScreen(screenElement) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            if (screenElement) {
                screenElement.classList.add('active');
            }
        }

        function updateHUD() {
            document.getElementById('attempts-hud').innerText = `Attempt: ${attempts}`;
            document.getElementById('level-hud').innerText = `Level ${currentLevel}`;
        }

        // Event Listeners for UI
        document.getElementById('btn-start').addEventListener('click', () => startGame(1));
        
        document.getElementById('btn-levels').addEventListener('click', () => {
            buildLevelSelect();
            switchScreen(uiLevelSelect);
        });
        
        document.getElementById('btn-back-menu').addEventListener('click', () => {
            switchScreen(uiMenu);
        });

        document.getElementById('btn-restart').addEventListener('click', () => {
            attempts++;
            updateHUD();
            resetLevel();
            switchScreen(null);
            hud.style.display = 'flex';
            progressContainer.style.display = 'block';
        });

        document.getElementById('btn-menu').addEventListener('click', () => {
            switchScreen(uiMenu);
        });

        document.getElementById('btn-next-level').addEventListener('click', () => {
            if(currentLevel < config.totalLevels) {
                startGame(currentLevel + 1);
            }
        });
        
        document.getElementById('btn-menu-win').addEventListener('click', () => {
            switchScreen(uiMenu);
        });

        function animate(currentTime) {
            requestAnimationFrame(animate);

            if (!lastTime) lastTime = currentTime;
            // Cap delta time to prevent physics glitches if tab is inactive
            const dt = Math.min((currentTime - lastTime) / 1000, 0.05); 
            lastTime = currentTime;

            if (state === GameState.PLAYING) {
                // Physics update
                if (!isGrounded) {
                    playerVelocityY -= config.gravity * dt;
                    
                    // Smooth rotation in air towards target
                    playerRotation += (targetRotation - playerRotation) * 10 * dt;
                    playerMesh.rotation.z = playerRotation;
                }

                // Apply velocity
                playerMesh.position.y += playerVelocityY * dt;
                playerMesh.position.x += config.playerSpeed * dt;

                checkCollisions();
                
                // Update Progress bar
                progress = Math.max(0, Math.min(100, (playerMesh.position.x / levelLength) * 100));
                progressBar.style.width = `${progress}%`;

                // Camera follow logic (smooth follow with offset)
                const targetCamX = playerMesh.position.x + config.cameraOffset.x;
                const targetCamY = playerMesh.position.y + config.cameraOffset.y;
                
                camera.position.x += (targetCamX - camera.position.x) * 5 * dt;
                camera.position.y += (targetCamY - camera.position.y) * 5 * dt;
                
                const lookAtTarget = new THREE.Vector3(
                    playerMesh.position.x + config.lookAtOffset.x,
                    playerMesh.position.y + config.lookAtOffset.y,
                    0
                );
                camera.lookAt(lookAtTarget);

                // Attach point light to player
                playerLight.position.copy(playerMesh.position);
                
                // Update background particles relative to camera for infinite feel
                if(bgParticles) {
                    const positions = bgParticles.geometry.attributes.position.array;
                    for(let i=0; i<positions.length; i+=3) {
                        if(positions[i] < camera.position.x - 50) positions[i] += 500;
                        if(positions[i] > camera.position.x + 450) positions[i] -= 500;
                    }
                    bgParticles.geometry.attributes.position.needsUpdate = true;
                    // Slowly rotate background particles
                    bgParticles.rotation.x += 0.1 * dt;
                }
            } else if (state === GameState.MENU || state === GameState.LEVEL_SELECT) {
                // Slowly pan camera in menu
                camera.position.x += 2 * dt;
                camera.position.y = 10;
                camera.position.z = 15;
                camera.lookAt(camera.position.x + 10, 0, 0);
                
                if(bgParticles) {
                    bgParticles.rotation.y += 0.2 * dt;
                }
            } else if (state === GameState.GAMEOVER) {
                // Slow down camera stop
                 camera.position.x += 5 * dt;
            }

            // Always update particles
            updateParticles(dt);
            updateTrail(dt);

            // Render scene via composer for post-processing effects (Bloom)
            composer.render();
        }

        // Initialize and Start
        initThreeJS();
        createGameObjects();
        generateLevel(1); // Generate a background level for the menu
        requestAnimationFrame(animate);

    </script>
</body>
</html>
