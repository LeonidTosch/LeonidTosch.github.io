    <title>Geometry Dash - Enhanced Edition</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Righteous&family=Russo+One&display=swap');

        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            box-sizing: border-box;
        }

        body {
            font-family: 'Russo One', sans-serif;
            background-color: #0d0f18;
            color: #ffffff;
            overflow: hidden;
            touch-action: manipulation;
        }

        .font-righteous {
            font-family: 'Righteous', cursive;
        }

        .gd-text-shadow {
            text-shadow: 3px 3px 0px #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0px 4px 10px rgba(0,0,0,0.8);
        }

        .gd-button {
            transition: all 0.15s ease-in-out;
            box-shadow: 0 6px 0 rgba(0,0,0,0.4), inset 0 2px 0 rgba(255,255,255,0.4);
        }

        .gd-button:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .gd-button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
        }

        /* Custom scrollbar for menu */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #00f0ff;
            border-radius: 4px;
        }

        /* Glow effects */
        .neon-border {
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5), inset 0 0 15px rgba(0, 240, 255, 0.3);
        }

        canvas {
            image-rendering: pixelated;
        }

    <!-- Game Engine Logic Script -->
    <script>
        // Sound & Music Synthesizer Class
        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.isInitialized = false;
                this.musicInterval = null;
                this.currentTempo = 130;
                this.beatIndex = 0;
            }

            init() {
                if (this.isInitialized) return;
                try {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                    this.isInitialized = true;
                } catch (e) {
                    console.warn("Web Audio API not supported", e);
                }
            }

            resume() {
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // Play procedural synth beep / sound effect
            playSFX(type) {
                if (this.muted || !this.ctx) return;
                this.resume();

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                if (type === 'jump') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(450, now + 0.12);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'pad') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'orb') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.15); // C6
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'death') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'portal') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(600, now + 0.15);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                }
            }

            // Start simple procedural synth beat
            startMusic(levelIndex) {
                this.stopMusic();
                if (this.muted || !this.ctx) return;
                this.resume();

                // Musical scales per level
                const scales = [
                    [130.81, 146.83, 164.81, 196.00, 220.00], // C Minor Pentatonic
                    [146.83, 164.81, 174.61, 220.00, 246.94], // D Minor
                    [164.81, 196.00, 220.00, 246.94, 293.66], // E Minor
                    [110.00, 130.81, 146.83, 164.81, 196.00]  // A Synthwave
                ];
                const scale = scales[levelIndex % scales.length];

                const beatIntervalMs = (60 / 128) * 1000 / 2; // 128 BPM eighth notes
                this.beatIndex = 0;

                this.musicInterval = setInterval(() => {
                    if (this.muted || !this.ctx) return;
                    const now = this.ctx.currentTime;
                    
                    // Bass pulse on quarter beats
                    if (this.beatIndex % 2 === 0) {
                        const bassOsc = this.ctx.createOscillator();
                        const bassGain = this.ctx.createGain();
                        bassOsc.type = 'sawtooth';
                        bassOsc.frequency.setValueAtTime(scale[0] / 2, now);
                        bassOsc.frequency.exponentialRampToValueAtTime(scale[0] / 4, now + 0.15);
                        bassGain.gain.setValueAtTime(0.12, now);
                        bassGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                        bassOsc.connect(bassGain);
                        bassGain.connect(this.ctx.destination);
                        bassOsc.start(now);
                        bassOsc.stop(now + 0.15);
                    }

                    // Synth Lead melody
                    if (Math.random() > 0.3) {
                        const note = scale[Math.floor(Math.random() * scale.length)];
                        const leadOsc = this.ctx.createOscillator();
                        const leadGain = this.ctx.createGain();
                        leadOsc.type = 'square';
                        leadOsc.frequency.setValueAtTime(note, now);
                        leadGain.gain.setValueAtTime(0.04, now);
                        leadGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                        leadOsc.connect(leadGain);
                        leadGain.connect(this.ctx.destination);
                        leadOsc.start(now);
                        leadOsc.stop(now + 0.12);
                    }

                    this.beatIndex++;
                }, beatIntervalMs);
            }

            stopMusic() {
                if (this.musicInterval) {
                    clearInterval(this.musicInterval);
                    this.musicInterval = null;
                }
            }
        }

        class GeometryDashGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.audio = new AudioEngine();

                // State
                this.currentLevelIndex = 0;
                this.gameState = 'MENU'; // MENU, PLAYING, PAUSED, GAMEOVER, COMPLETE
                this.isPracticeMode = false;
                this.checkpoints = [];

                // Input flags
                this.isJumpPressed = false;
                this.isJumpHeld = false;

                // Skin customization
                this.skin = {
                    primary: '#00f0ff',
                    secondary: '#ff0055'
                };

                // Player physics & mode
                this.player = {
                    x: 100,
                    y: 0,
                    vx: 0,
                    vy: 0,
                    size: 36,
                    rotation: 0,
                    mode: 'cube', // 'cube', 'ship', 'wave'
                    gravityDir: 1, // 1 normal, -1 inverted
                    onGround: false,
                    dead: false
                };

                // Camera
                this.cameraX = 0;
                this.groundY = 120; // Distance from bottom canvas

                // Particles
                this.particles = [];
                this.trail = [];

                // Saved high scores / progress
                this.levelProgress = JSON.parse(localStorage.getItem('gd_progress')) || {
                    1: { normal: 0, practice: 0 },
                    2: { normal: 0, practice: 0 },
                    3: { normal: 0, practice: 0 }
                };

                this.initCanvasSize();
                this.bindEvents();
                this.setupUI();
                this.initCustomizer();

                // Start game render loop
                this.lastTime = performance.now();
                requestAnimationFrame(this.gameLoop.bind(this));
            }

            initCanvasSize() {
                const container = document.getElementById('game-container');
                this.canvas.width = container.clientWidth || 960;
                this.canvas.height = container.clientHeight || 540;
            }

            bindEvents() {
                window.addEventListener('resize', () => this.initCanvasSize());

                // Keydown / Keyup for JUMP (Space, ArrowUp, KeyW)
                window.addEventListener('keydown', (e) => {
                    if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
                        e.preventDefault();
                        if (!this.isJumpHeld) {
                            this.triggerJump();
                        }
                        this.isJumpHeld = true;
                    }

                    // Practice mode keys
                    if (e.code === 'KeyZ' && this.gameState === 'PLAYING' && this.isPracticeMode) {
                        this.placeCheckpoint();
                    }
                    if (e.code === 'KeyX' && this.gameState === 'PLAYING' && this.isPracticeMode) {
                        this.removeCheckpoint();
                    }
                    if (e.code === 'KeyP' || e.code === 'Escape') {
                        if (this.gameState === 'PLAYING') this.pauseGame();
                        else if (this.gameState === 'PAUSED') this.resumeGame();
                    }
                });

                window.addEventListener('keyup', (e) => {
                    if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
                        this.isJumpHeld = false;
                        this.isJumpPressed = false;
                    }
                });

                // Mouse & Touch Input handlers (Trigger Jump anywhere)
                const handlePointerStart = (e) => {
                    // Ignore clicks on HTML UI buttons
                    if (e.target.closest('button') || e.target.closest('#main-menu') || e.target.closest('#pause-modal') || e.target.closest('#customizer-modal')) {
                        return;
                    }
                    e.preventDefault();
                    this.audio.init(); // Initialize audio on user interaction
                    if (!this.isJumpHeld) {
                        this.triggerJump();
                    }
                    this.isJumpHeld = true;
                };

                const handlePointerEnd = (e) => {
                    if (e.target.closest('button')) return;
                    this.isJumpHeld = false;
                    this.isJumpPressed = false;
                };

                // Bind to both canvas & window
                this.canvas.addEventListener('pointerdown', handlePointerStart);
                window.addEventListener('pointerdown', handlePointerStart);
                window.addEventListener('pointerup', handlePointerEnd);

                // Dedicated On-screen jump button
                const btnTouch = document.getElementById('btn-touch-jump');
                btnTouch.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    this.triggerJump();
                    this.isJumpHeld = true;
                });
                btnTouch.addEventListener('pointerup', (e) => {
                    e.stopPropagation();
                    this.isJumpHeld = false;
                    this.isJumpPressed = false;
                });
            }

            triggerJump() {
                this.isJumpPressed = true;
                this.audio.resume();

                if (this.gameState === 'PLAYING' && !this.player.dead) {
                    // Check if player is near/inside a jump orb
                    const orbTouched = this.checkOrbTouch();
                    
                    if (!orbTouched && this.player.mode === 'cube' && this.player.onGround) {
                        // Regular Cube Jump
                        this.player.vy = -12 * this.player.gravityDir;
                        this.player.onGround = false;
                        this.audio.playSFX('jump');
                        this.createJumpParticles();
                    }
                }
            }

            setupUI() {
                // Menu Buttons
                document.getElementById('btn-play').addEventListener('click', () => this.startLevel(this.currentLevelIndex));
                document.getElementById('btn-prev-level').addEventListener('click', () => this.changeMenuLevel(-1));
                document.getElementById('btn-next-level').addEventListener('click', () => this.changeMenuLevel(1));

                // Pause Buttons
                document.getElementById('btn-pause').addEventListener('click', () => this.pauseGame());
                document.getElementById('btn-resume').addEventListener('click', () => this.resumeGame());
                document.getElementById('btn-restart').addEventListener('click', () => {
                    this.hideModals();
                    this.startLevel(this.currentLevelIndex);
                });
                document.getElementById('btn-exit').addEventListener('click', () => {
                    this.hideModals();
                    this.openMenu();
                });

                // Level Complete Button
                document.getElementById('btn-complete-continue').addEventListener('click', () => {
                    this.hideModals();
                    this.openMenu();
                });

                // Practice Mode Toggle
                const btnPractice = document.getElementById('btn-practice');
                btnPractice.addEventListener('click', () => {
                    this.isPracticeMode = !this.isPracticeMode;
                    btnPractice.classList.toggle('bg-emerald-600', this.isPracticeMode);
                    btnPractice.classList.toggle('bg-slate-700', !this.isPracticeMode);
                    document.getElementById('practice-controls').classList.toggle('hidden', !this.isPracticeMode);
                });

                document.getElementById('btn-place-checkpoint').addEventListener('click', () => this.placeCheckpoint());
                document.getElementById('btn-delete-checkpoint').addEventListener('click', () => this.removeCheckpoint());

                // Sound Toggle
                document.getElementById('btn-sound-toggle').addEventListener('click', () => {
                    this.audio.muted = !this.audio.muted;
                    const icon = document.getElementById('sound-icon');
                    icon.className = this.audio.muted ? 'fa-solid fa-volume-xmark text-lg text-red-400' : 'fa-solid fa-volume-high text-lg text-cyan-400';
                    if (this.audio.muted) this.audio.stopMusic();
                    else if (this.gameState === 'PLAYING') this.audio.startMusic(this.currentLevelIndex);
                });

                this.updateMenuLevelCard();
            }

            changeMenuLevel(dir) {
                this.currentLevelIndex = (this.currentLevelIndex + dir + LEVEL_DATA.length) % LEVEL_DATA.length;
                this.updateMenuLevelCard();
            }

            updateMenuLevelCard() {
                const lvl = LEVEL_DATA[this.currentLevelIndex];
                document.getElementById('menu-level-title').innerText = `${lvl.id}. ${lvl.name}`;
                document.getElementById('menu-level-desc').innerText = lvl.desc;
                
                const badge = document.getElementById('menu-level-difficulty');
                badge.innerText = lvl.difficulty;
                badge.className = `inline-block px-3 py-1 rounded-full text-xs font-bold ${lvl.diffColor} mb-2`;

                const prog = this.levelProgress[lvl.id] || { normal: 0, practice: 0 };
                document.getElementById('menu-normal-progress').innerText = `${prog.normal}%`;
                document.getElementById('menu-practice-progress').innerText = `${prog.practice}%`;
            }

            initCustomizer() {
                const colors = ['#00f0ff', '#ff0055', '#ffcc00', '#00ff66', '#a800ff', '#ffffff'];
                const pContainer = document.getElementById('primary-color-picker');
                const sContainer = document.getElementById('secondary-color-picker');

                pContainer.innerHTML = '';
                sContainer.innerHTML = '';

                colors.forEach(color => {
                    // Primary
                    const pBtn = document.createElement('div');
                    pBtn.className = 'w-8 h-8 rounded-full cursor-pointer border-2 border-white/40 hover:scale-110 transition-transform';
                    pBtn.style.backgroundColor = color;
                    pBtn.addEventListener('click', () => {
                        this.skin.primary = color;
                        this.renderSkinPreview();
                    });
                    pContainer.appendChild(pBtn);

                    // Secondary
                    const sBtn = document.createElement('div');
                    sBtn.className = 'w-8 h-8 rounded-full cursor-pointer border-2 border-white/40 hover:scale-110 transition-transform';
                    sBtn.style.backgroundColor = color;
                    sBtn.addEventListener('click', () => {
                        this.skin.secondary = color;
                        this.renderSkinPreview();
                    });
                    sContainer.appendChild(sBtn);
                });

                document.getElementById('btn-customizer').addEventListener('click', () => {
                    document.getElementById('customizer-modal').classList.remove('hidden');
                    this.renderSkinPreview();
                });

                document.getElementById('btn-close-customizer').addEventListener('click', () => {
                    document.getElementById('customizer-modal').classList.add('hidden');
                });
            }

            renderSkinPreview() {
                const prevCanvas = document.getElementById('skinPreviewCanvas');
                const ctx = prevCanvas.getContext('2d');
                ctx.clearRect(0, 0, prevCanvas.width, prevCanvas.height);

                ctx.save();
                ctx.translate(50, 50);

                // Draw Preview Icon
                ctx.fillStyle = this.skin.primary;
                ctx.fillRect(-25, -25, 50, 50);

                ctx.lineWidth = 4;
                ctx.strokeStyle = this.skin.secondary;
                ctx.strokeRect(-25, -25, 50, 50);

                // Inner detail square
                ctx.fillStyle = this.skin.secondary;
                ctx.fillRect(-10, -10, 20, 20);

                // Eyes
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(-18, -15, 10, 10);
                ctx.fillRect(8, -15, 10, 10);

                ctx.fillStyle = '#000000';
                ctx.fillRect(-14, -12, 5, 5);
                ctx.fillRect(12, -12, 5, 5);

                ctx.restore();
            }

            startLevel(levelIdx) {
                this.currentLevelIndex = levelIdx;
                const level = LEVEL_DATA[levelIdx];

                this.gameState = 'PLAYING';
                this.checkpoints = [];

                // Reset Player state
                this.player = {
                    x: 100,
                    y: 0, // Above floor
                    vx: level.speed,
                    vy: 0,
                    size: 36,
                    rotation: 0,
                    mode: 'cube',
                    gravityDir: 1,
                    onGround: true,
                    dead: false
                };

                this.cameraX = 0;
                this.particles = [];
                this.trail = [];

                // Update HUD
                document.getElementById('hud-level-name').innerText = level.name;
                document.getElementById('hud-mode-badge').innerText = 'CUBE';
                document.getElementById('hud').classList.remove('hidden');
                document.getElementById('controls-hint').classList.remove('hidden');
                document.getElementById('main-menu').classList.add('hidden');

                // Audio
                this.audio.startMusic(levelIdx);
            }

            openMenu() {
                this.gameState = 'MENU';
                this.audio.stopMusic();
                document.getElementById('hud').classList.add('hidden');
                document.getElementById('controls-hint').classList.add('hidden');
                document.getElementById('main-menu').classList.remove('hidden');
                this.updateMenuLevelCard();
            }

            pauseGame() {
                if (this.gameState !== 'PLAYING') return;
                this.gameState = 'PAUSED';
                document.getElementById('pause-modal').classList.remove('hidden');
            }

            resumeGame() {
                this.gameState = 'PLAYING';
                document.getElementById('pause-modal').classList.add('hidden');
            }

            hideModals() {
                document.getElementById('pause-modal').classList.add('hidden');
                document.getElementById('complete-modal').classList.add('hidden');
            }

            placeCheckpoint() {
                if (!this.isPracticeMode || this.player.dead) return;
                this.checkpoints.push({
                    x: this.player.x,
                    y: this.player.y,
                    vy: this.player.vy,
                    mode: this.player.mode,
                    gravityDir: this.player.gravityDir
                });
                this.audio.playSFX('orb');
            }

            removeCheckpoint() {
                if (this.checkpoints.length > 0) {
                    this.checkpoints.pop();
                    this.audio.playSFX('jump');
                }
            }

            respawnCheckpoint() {
                if (this.checkpoints.length > 0) {
                    const cp = this.checkpoints[this.checkpoints.length - 1];
                    this.player.x = cp.x;
                    this.player.y = cp.y;
                    this.player.vy = 0;
                    this.player.mode = cp.mode;
                    this.player.gravityDir = cp.gravityDir;
                    this.player.dead = false;
                    this.player.rotation = 0;
                    document.getElementById('hud-mode-badge').innerText = cp.mode.toUpperCase();
                } else {
                    this.startLevel(this.currentLevelIndex);
                }
            }

            update(dt) {
                if (this.gameState !== 'PLAYING') return;

                const level = LEVEL_DATA[this.currentLevelIndex];

                if (this.player.dead) return;

                // Move Player Horizontally
                this.player.x += this.player.vx;

                // Mode specific movement logic
                if (this.player.mode === 'cube') {
                    // Gravity
                    this.player.vy += 0.6 * this.player.gravityDir;

                    // Continuous Jump when holding input on ground
                    if (this.isJumpHeld && this.player.onGround) {
                        this.triggerJump();
                    }

                    // Rotate Cube while in air
                    if (!this.player.onGround) {
                        this.player.rotation += 8 * this.player.gravityDir;
                    } else {
                        // Snap rotation to 90 degrees on ground
                        this.player.rotation = Math.round(this.player.rotation / 90) * 90;
                    }
                } else if (this.player.mode === 'ship') {
                    // Ship floating logic
                    if (this.isJumpHeld) {
                        this.player.vy -= 0.5 * this.player.gravityDir;
                    } else {
                        this.player.vy += 0.5 * this.player.gravityDir;
                    }
                    // Terminal velocity cap
                    this.player.vy = Math.max(-8, Math.min(8, this.player.vy));
                    this.player.rotation = this.player.vy * 4;
                } else if (this.player.mode === 'wave') {
                    // Wave diagonal zigzag
                    if (this.isJumpHeld) {
                        this.player.vy = -this.player.vx * this.player.gravityDir;
                        this.player.rotation = -45 * this.player.gravityDir;
                    } else {
                        this.player.vy = this.player.vx * this.player.gravityDir;
                        this.player.rotation = 45 * this.player.gravityDir;
                    }
                }

                // Apply vertical velocity
                this.player.y += this.player.vy;

                // Camera follow player
                this.cameraX = this.player.x - 150;

                // Floor & Ceiling Collision
                const maxY = this.canvas.height - this.groundY - this.player.size;
                const minY = 0;

                if (this.player.gravityDir === 1) {
                    if (this.player.y >= maxY) {
                        this.player.y = maxY;
                        this.player.vy = 0;
                        this.player.onGround = true;
                    } else {
                        this.player.onGround = false;
                    }
                } else {
                    // Inverted gravity floor ceiling
                    if (this.player.y <= minY) {
                        this.player.y = minY;
                        this.player.vy = 0;
                        this.player.onGround = true;
                    } else {
                        this.player.onGround = false;
                    }
                }

                // Object Collision Detection
                this.checkObjectCollisions(level);

                // Add Trail Particles
                if (Math.random() > 0.3) {
                    this.trail.push({
                        x: this.player.x + this.player.size / 2,
                        y: this.player.y + this.player.size / 2,
                        size: this.player.size * 0.4,
                        alpha: 0.8,
                        color: this.skin.primary
                    });
                }

                // Update Trail
                for (let i = this.trail.length - 1; i >= 0; i--) {
                    this.trail[i].alpha -= 0.04;
                    if (this.trail[i].alpha <= 0) this.trail.splice(i, 1);
                }

                // Update Death / Jump Particles
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= 0.02;
                    if (p.alpha <= 0) this.particles.splice(i, 1);
                }

                // Check Level Completion
                const currentProgress = Math.min(100, Math.floor((this.player.x / level.length) * 100));
                document.getElementById('progress-percent').innerText = `${currentProgress}%`;
                document.getElementById('progress-fill').style.width = `${currentProgress}%`;

                // Update local storage high scores
                if (!this.levelProgress[level.id]) this.levelProgress[level.id] = { normal: 0, practice: 0 };
                const modeKey = this.isPracticeMode ? 'practice' : 'normal';
                if (currentProgress > this.levelProgress[level.id][modeKey]) {
                    this.levelProgress[level.id][modeKey] = currentProgress;
                    localStorage.setItem('gd_progress', JSON.stringify(this.levelProgress));
                }

                if (this.player.x >= level.length) {
                    this.completeLevel();
                }
            }

            checkObjectCollisions(level) {
                const px = this.player.x;
                const py = this.player.y;
                const ps = this.player.size;
                const pBox = { left: px, right: px + ps, top: py, bottom: py + ps };

                const groundYPos = this.canvas.height - this.groundY;

                level.objects.forEach(obj => {
                    const objY = groundYPos - obj.y - (obj.h || 40);
                    const objBox = {
                        left: obj.x,
                        right: obj.x + (obj.w || 40),
                        top: objY,
                        bottom: objY + (obj.h || 40)
                    };

                    // Broadphase proximity check
                    if (Math.abs(obj.x - px) > 200) return;

                    // AABB Overlap check
                    if (pBox.right > objBox.left && pBox.left < objBox.right &&
                        pBox.bottom > objBox.top && pBox.top < objBox.bottom) {

                        if (obj.type === 'spike') {
                            // Hitbox inset for precise spike fairness
                            const inset = 8;
                            if (pBox.right - inset > objBox.left && pBox.left + inset < objBox.right &&
                                pBox.bottom - inset > objBox.top && pBox.top + inset < objBox.bottom) {
                                this.killPlayer();
                            }
                        } else if (obj.type === 'block') {
                            // Top landing collision vs side crash
                            const prevBottom = pBox.bottom - this.player.vy;
                            if (prevBottom <= objBox.top + 10 && this.player.vy >= 0) {
                                // Landed on block
                                this.player.y = objBox.top - ps;
                                this.player.vy = 0;
                                this.player.onGround = true;
                            } else {
                                // Crashed into side or bottom of block
                                this.killPlayer();
                            }
                        } else if (obj.type === 'pad') {
                            // Automatic jump pad bounce
                            this.player.vy = -16 * this.player.gravityDir;
                            this.audio.playSFX('pad');
                            this.createParticles(this.player.x, this.player.y, '#ffea00', 12);
                        } else if (obj.type === 'portal') {
                            // Portal mode switch
                            if (obj.portalType === 'ship' && this.player.mode !== 'ship') {
                                this.player.mode = 'ship';
                                document.getElementById('hud-mode-badge').innerText = 'SHIP';
                                this.audio.playSFX('portal');
                            } else if (obj.portalType === 'cube' && this.player.mode !== 'cube') {
                                this.player.mode = 'cube';
                                document.getElementById('hud-mode-badge').innerText = 'CUBE';
                                this.audio.playSFX('portal');
                            } else if (obj.portalType === 'wave' && this.player.mode !== 'wave') {
                                this.player.mode = 'wave';
                                document.getElementById('hud-mode-badge').innerText = 'WAVE';
                                this.audio.playSFX('portal');
                            } else if (obj.portalType === 'gravity_flip') {
                                this.player.gravityDir = -1;
                                this.audio.playSFX('portal');
                            } else if (obj.portalType === 'gravity_normal') {
                                this.player.gravityDir = 1;
                                this.audio.playSFX('portal');
                            }
                        }
                    }
                });
            }

            checkOrbTouch() {
                const level = LEVEL_DATA[this.currentLevelIndex];
                const groundYPos = this.canvas.height - this.groundY;
                const px = this.player.x + this.player.size / 2;
                const py = this.player.y + this.player.size / 2;

                for (let obj of level.objects) {
                    if (obj.type === 'orb') {
                        const orbX = obj.x + 20;
                        const orbY = groundYPos - obj.y - 20;
                        const dist = Math.hypot(px - orbX, py - orbY);

                        if (dist < 45) {
                            // Trigger Orb Jump
                            this.player.vy = (obj.orbType === 'pink' ? -10 : -14) * this.player.gravityDir;
                            this.audio.playSFX('orb');
                            this.createParticles(orbX, orbY, obj.orbType === 'pink' ? '#ff00aa' : '#ffe600', 15);
                            return true;
                        }
                    }
                }
                return false;
            }

            killPlayer() {
                if (this.player.dead) return;
                this.player.dead = true;
                this.audio.playSFX('death');
                this.createExplosionParticles(this.player.x + 18, this.player.y + 18);

                setTimeout(() => {
                    if (this.isPracticeMode && this.checkpoints.length > 0) {
                        this.respawnCheckpoint();
                    } else {
                        this.startLevel(this.currentLevelIndex);
                    }
                }, 600);
            }

            completeLevel() {
                this.gameState = 'COMPLETE';
                this.audio.stopMusic();
                this.audio.playSFX('pad');

                const level = LEVEL_DATA[this.currentLevelIndex];
                document.getElementById('complete-level-name').innerText = level.name;
                document.getElementById('complete-modal').classList.remove('hidden');
            }

            createJumpParticles() {
                this.createParticles(this.player.x + 18, this.player.y + 36, this.skin.primary, 8);
            }

            createParticles(x, y, color, count) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 4 + 1;
                    this.particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        alpha: 1,
                        color: color
                    });
                }
            }

            createExplosionParticles(x, y) {
                for (let i = 0; i < 30; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 8 + 2;
                    this.particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        alpha: 1,
                        color: Math.random() > 0.5 ? this.skin.primary : this.skin.secondary
                    });
                }
            }

            render() {
                const w = this.canvas.width;
                const h = this.canvas.height;
                const level = LEVEL_DATA[this.currentLevelIndex];

                // Clear Background
                const bgGrad = this.ctx.createLinearGradient(0, 0, 0, h);
                bgGrad.addColorStop(0, level.bgGradient[0]);
                bgGrad.addColorStop(1, level.bgGradient[1]);
                this.ctx.fillStyle = bgGrad;
                this.ctx.fillRect(0, 0, w, h);

                // Draw Scrolling Background Grid
                this.ctx.strokeStyle = `${level.colorTheme}15`;
                this.ctx.lineWidth = 1;
                const gridSize = 40;
                const offsetX = (this.cameraX * 0.3) % gridSize;

                for (let x = -offsetX; x < w; x += gridSize) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, 0);
                    this.ctx.lineTo(x, h);
                    this.ctx.stroke();
                }

                // Draw Floor & Ceiling Ground
                const groundYPos = h - this.groundY;

                // Floor gradient line
                this.ctx.fillStyle = '#090d16';
                this.ctx.fillRect(0, groundYPos, w, this.groundY);

                this.ctx.strokeStyle = level.colorTheme;
                this.ctx.lineWidth = 3;
                this.ctx.beginPath();
                this.ctx.moveTo(0, groundYPos);
                this.ctx.lineTo(w, groundYPos);
                this.ctx.stroke();

                // Save context for camera transformation
                this.ctx.save();
                this.ctx.translate(-this.cameraX, 0);

                // Draw Checkpoints (Practice Mode)
                this.checkpoints.forEach((cp, idx) => {
                    this.ctx.fillStyle = '#00ff66';
                    this.ctx.beginPath();
                    this.ctx.arc(cp.x + 18, cp.y + 18, 12, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.font = '10px Russo One';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText(idx + 1, cp.x + 18, cp.y + 22);
                });

                // Draw Level Objects
                level.objects.forEach(obj => {
                    const objY = groundYPos - obj.y - (obj.h || 40);

                    // Skip off-screen objects
                    if (obj.x + (obj.w || 40) < this.cameraX || obj.x > this.cameraX + w + 100) return;

                    if (obj.type === 'spike') {
                        // Draw Triangle Spike
                        this.ctx.fillStyle = '#ff2a55';
                        this.ctx.strokeStyle = '#ffffff';
                        this.ctx.lineWidth = 2;

                        this.ctx.beginPath();
                        this.ctx.moveTo(obj.x, objY + 40);
                        this.ctx.lineTo(obj.x + 20, objY);
                        this.ctx.lineTo(obj.x + 40, objY + 40);
                        this.ctx.closePath();
                        this.ctx.fill();
                        this.ctx.stroke();
                    } else if (obj.type === 'block') {
                        // Draw Solid Neon Block
                        this.ctx.fillStyle = '#111827';
                        this.ctx.fillRect(obj.x, objY, obj.w, obj.h);

                        this.ctx.strokeStyle = level.colorTheme;
                        this.ctx.lineWidth = 2;
                        this.ctx.strokeRect(obj.x, objY, obj.w, obj.h);

                        // Inner cross pattern
                        this.ctx.strokeStyle = `${level.colorTheme}40`;
                        this.ctx.strokeRect(obj.x + 4, objY + 4, obj.w - 8, obj.h - 8);
                    } else if (obj.type === 'pad') {
                        // Draw Jump Pad
                        this.ctx.fillStyle = '#ffea00';
                        this.ctx.fillRect(obj.x, objY + 30, 40, 10);
                        this.ctx.strokeStyle = '#ffffff';
                        this.ctx.strokeRect(obj.x, objY + 30, 40, 10);
                    } else if (obj.type === 'orb') {
                        // Draw Jump Orb
                        this.ctx.strokeStyle = obj.orbType === 'pink' ? '#ff00aa' : '#ffe600';
                        this.ctx.lineWidth = 4;
                        this.ctx.beginPath();
                        this.ctx.arc(obj.x + 20, objY + 20, 16, 0, Math.PI * 2);
                        this.ctx.stroke();

                        this.ctx.fillStyle = '#ffffff';
                        this.ctx.beginPath();
                        this.ctx.arc(obj.x + 20, objY + 20, 6, 0, Math.PI * 2);
                        this.ctx.fill();
                    } else if (obj.type === 'portal') {
                        // Draw Portal Ring
                        const pColor = obj.portalType === 'ship' ? '#00f0ff' : (obj.portalType === 'wave' ? '#f000ff' : '#00ff66');
                        this.ctx.strokeStyle = pColor;
                        this.ctx.lineWidth = 6;
                        this.ctx.beginPath();
                        this.ctx.ellipse(obj.x + 15, objY + 20, 15, 35, 0, 0, Math.PI * 2);
                        this.ctx.stroke();
                    }
                });

                // Draw Player Motion Trail
                this.trail.forEach(t => {
                    this.ctx.fillStyle = t.color;
                    this.ctx.globalAlpha = t.alpha;
                    this.ctx.fillRect(t.x - t.size / 2, t.y - t.size / 2, t.size, t.size);
                });
                this.ctx.globalAlpha = 1.0;

                // Draw Player Icon
                if (!this.player.dead) {
                    this.ctx.save();
                    this.ctx.translate(this.player.x + this.player.size / 2, this.player.y + this.player.size / 2);
                    this.ctx.rotate((this.player.rotation * Math.PI) / 180);

                    if (this.player.mode === 'cube') {
                        // Cube Primary Body
                        this.ctx.fillStyle = this.skin.primary;
                        this.ctx.fillRect(-18, -18, 36, 36);

                        // Cube Secondary Stroke
                        this.ctx.lineWidth = 3;
                        this.ctx.strokeStyle = this.skin.secondary;
                        this.ctx.strokeRect(-18, -18, 36, 36);

                        // Inner Detail
                        this.ctx.fillStyle = this.skin.secondary;
                        this.ctx.fillRect(-7, -7, 14, 14);

                        // Eyes
                        this.ctx.fillStyle = '#ffffff';
                        this.ctx.fillRect(-12, -10, 8, 8);
                        this.ctx.fillRect(4, -10, 8, 8);

                        this.ctx.fillStyle = '#000000';
                        this.ctx.fillRect(-9, -8, 4, 4);
                        this.ctx.fillRect(7, -8, 4, 4);
                    } else if (this.player.mode === 'ship') {
                        // Ship Rocket Shape
                        this.ctx.fillStyle = this.skin.primary;
                        this.ctx.beginPath();
                        this.ctx.moveTo(18, 0);
                        this.ctx.lineTo(-18, -14);
                        this.ctx.lineTo(-10, 0);
                        this.ctx.lineTo(-18, 14);
                        this.ctx.closePath();
                        this.ctx.fill();

                        this.ctx.strokeStyle = this.skin.secondary;
                        this.ctx.lineWidth = 3;
                        this.ctx.stroke();
                    } else if (this.player.mode === 'wave') {
                        // Wave Dart Triangle
                        this.ctx.fillStyle = this.skin.primary;
                        this.ctx.beginPath();
                        this.ctx.moveTo(18, 0);
                        this.ctx.lineTo(-14, -14);
                        this.ctx.lineTo(-14, 14);
                        this.ctx.closePath();
                        this.ctx.fill();

                        this.ctx.strokeStyle = this.skin.secondary;
                        this.ctx.lineWidth = 3;
                        this.ctx.stroke();
                    }

                    this.ctx.restore();
                }

                // Draw Particles
                this.particles.forEach(p => {
                    this.ctx.fillStyle = p.color;
                    this.ctx.globalAlpha = p.alpha;
                    this.ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
                });
                this.ctx.globalAlpha = 1.0;

                this.ctx.restore();
            }

            gameLoop(timestamp) {
                const dt = (timestamp - this.lastTime) / 1000;
                this.lastTime = timestamp;

                this.update(dt);
                this.render();

                requestAnimationFrame(this.gameLoop.bind(this));
            }
        }

        window.addEventListener('load', () => {
            window.game = new GeometryDashGame();
        });
    </script>
</body>
</html>
