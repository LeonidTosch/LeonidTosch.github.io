<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Kikoriki Chase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Sky blue background */
            font-family: 'Inter', sans-serif;
            touch-action: none; /* Prevent default touch actions like scrolling */
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through UI layer */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        /* Mobile Controls */
        #dpad-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: none; /* Hidden on desktop by default via JS */
            pointer-events: auto;
            touch-action: none;
        }
        .dpad-btn {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: #333;
            user-select: none;
        }
        .dpad-btn:active {
            background: rgba(255, 255, 255, 0.8);
        }
        #up-btn { top: 0; left: 50px; }
        #down-btn { bottom: 0; left: 50px; }
        #left-btn { top: 50px; left: 0; }
        #right-btn { top: 50px; right: 0; }
        
        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 50;
        }
        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 90%;
            width: 400px;
        }
    </style>
</head>
<body>

    <div id="game-container"></div>

    <div id="ui-layer">
        <div class="p-4 flex justify-between items-start pointer-events-auto">
            <div>
                <h1 class="text-3xl font-black text-white drop-shadow-md outline-text" style="-webkit-text-stroke: 1px black;">3D Kikoriki Chase</h1>
                <p class="text-xl text-yellow-300 font-bold drop-shadow-md outline-text" style="-webkit-text-stroke: 1px black;">Score: <span id="score">0</span> / <span id="total-enemies">0</span></p>
            </div>
        </div>

        <div id="dpad-container">
            <div id="up-btn" class="dpad-btn">▲</div>
            <div id="down-btn" class="dpad-btn">▼</div>
            <div id="left-btn" class="dpad-btn">◀</div>
            <div id="right-btn" class="dpad-btn">▶</div>
        </div>
    </div>

    <!-- Start Modal -->
    <div id="startModal" class="modal flex">
        <div class="modal-content">
            <h2 class="text-3xl font-bold mb-4 text-orange-600">3D Kikoriki Chase</h2>
            <p class="mb-4 text-gray-700">You are the Bear (Kopatych). Use Arrow Keys, WASD, or on-screen controls to move.</p>
            <p class="mb-6 text-gray-700 font-semibold">Catch all the others!</p>
            <button id="startBtn" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-6 rounded-full w-full text-xl shadow-lg transition-transform transform hover:scale-105 active:scale-95">Play Game</button>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="gameOverModal" class="modal">
        <div class="modal-content">
            <h2 class="text-4xl font-bold mb-4 text-green-600" id="gameOverTitle">Victory!</h2>
            <p class="mb-6 text-gray-700 text-lg">You caught everyone.</p>
            <button id="restartBtn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-full w-full text-xl shadow-lg transition-transform transform hover:scale-105 active:scale-95">Play Again</button>
        </div>
    </div>

    <script>
        // Game State
        let scene, camera, renderer;
        let player;
        let enemies = [];
        let score = 0;
        let totalEnemies = 7; // Number of other characters
        let gameActive = false;
        let keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, a: false, s: false, d: false };
        let touchControls = { up: false, down: false, left: false, right: false };
        
        // Constants
        const PLAYER_SPEED = 15;
        const ENEMY_SPEED = 6;
        const BOUNDARY = 45; // Field size limit
        
        // Character Config (Colors to approximate characters without complex textures)
        // Kopatych (Bear) - Brownish orange
        // Krosh (Rabbit) - Cyan
        // Nyusha (Pig) - Pink
        // Barash (Ram) - Light Purple
        // Losyash (Moose) - Yellow/Orange
        // Pin (Penguin) - Black/White (simplified to dark grey here)
        // Sovunya (Owl) - Purple
        // Kar-Karych (Crow) - Dark Blue
        
        const enemyConfigs = [
            { name: 'Krosh', color: 0x00FFFF },
            { name: 'Nyusha', color: 0xFFB6C1 },
            { name: 'Barash', color: 0xDDA0DD },
            { name: 'Losyash', color: 0xFFA500 },
            { name: 'Pin', color: 0x333333 },
            { name: 'Sovunya', color: 0x800080 },
            { name: 'Kar-Karych', color: 0x00008B }
        ];

        // UI Elements
        const scoreEl = document.getElementById('score');
        const totalEnemiesEl = document.getElementById('total-enemies');
        const startModal = document.getElementById('startModal');
        const gameOverModal = document.getElementById('gameOverModal');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const dpadContainer = document.getElementById('dpad-container');

        // Particle system
        let particles = [];

        function init() {
            // Setup scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Sky color
            scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

            // Setup camera (Top-down, slightly angled)
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 30, 20); // Initial position, will be updated to follow player
            camera.lookAt(0, 0, 0);

            // Setup renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('game-container').appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 50, 20);
            dirLight.castShadow = true;
            dirLight.shadow.camera.left = -50;
            dirLight.shadow.camera.right = 50;
            dirLight.shadow.camera.top = 50;
            dirLight.shadow.camera.bottom = -50;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            // Ground
            createGround();

            // Player (Kopatych - Bear)
            createPlayer();

            // Event Listeners
            window.addEventListener('resize', onWindowResize, false);
            setupInput();
            
            // Check for mobile to show D-pad
            if (isMobile()) {
                dpadContainer.style.display = 'block';
            }

            // Start loop (will only move things if gameActive)
            animate();
        }

        function createGround() {
            // Simple green grass material
            const groundGeo = new THREE.PlaneGeometry(100, 100);
            // Create a simple checkerboard texture procedurally
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const context = canvas.getContext('2d');
            context.fillStyle = '#4CAF50'; // Base green
            context.fillRect(0, 0, 256, 256);
            context.fillStyle = '#45a049'; // Slightly darker green
            context.fillRect(0, 0, 128, 128);
            context.fillRect(128, 128, 128, 128);
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(10, 10);

            const groundMat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Add simple boundary walls (invisible but keep entities inside)
            // Logic handled in update loop
        }

        function createCharacterMesh(color, size = 1) {
            // Kikoriki characters are basically spheres
            const group = new THREE.Group();

            // Body
            const bodyGeo = new THREE.SphereGeometry(size, 32, 32);
            const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.5, metalness: 0.1 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = size; // Rest on ground
            body.castShadow = true;
            group.add(body);

            // Simple eyes
            const eyeGeo = new THREE.SphereGeometry(size * 0.2, 16, 16);
            const eyeMatWhite = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const eyeMatBlack = new THREE.MeshBasicMaterial({ color: 0x000000 });

            // Right eye
            const rightEye = new THREE.Mesh(eyeGeo, eyeMatWhite);
            rightEye.position.set(size * 0.3, size * 1.2, size * 0.8);
            const rightPupil = new THREE.Mesh(new THREE.SphereGeometry(size * 0.08, 8, 8), eyeMatBlack);
            rightPupil.position.set(size * 0.35, size * 1.2, size * 0.95);
            group.add(rightEye);
            group.add(rightPupil);

            // Left eye
            const leftEye = new THREE.Mesh(eyeGeo, eyeMatWhite);
            leftEye.position.set(-size * 0.3, size * 1.2, size * 0.8);
            const leftPupil = new THREE.Mesh(new THREE.SphereGeometry(size * 0.08, 8, 8), eyeMatBlack);
            leftPupil.position.set(-size * 0.35, size * 1.2, size * 0.95);
            group.add(leftEye);
            group.add(leftPupil);

            return group;
        }

        function createPlayer() {
            // Kopatych (Bear) - Brownish orange, slightly larger
            player = createCharacterMesh(0xD2691E, 1.2);
            
            // Add simple bear ears
            const earGeo = new THREE.SphereGeometry(0.3, 16, 16);
            const earMat = new THREE.MeshStandardMaterial({ color: 0xD2691E });
            
            const rightEar = new THREE.Mesh(earGeo, earMat);
            rightEar.position.set(0.8, 2.0, 0);
            player.add(rightEar);
            
            const leftEar = new THREE.Mesh(earGeo, earMat);
            leftEar.position.set(-0.8, 2.0, 0);
            player.add(leftEar);

            scene.add(player);
        }

        function spawnEnemies() {
            // Remove existing enemies
            enemies.forEach(e => scene.remove(e.mesh));
            enemies = [];

            // Add selected config enemies
            for (let i = 0; i < totalEnemies; i++) {
                if (i >= enemyConfigs.length) break; // Fallback if totalEnemies > configs
                
                const config = enemyConfigs[i];
                const mesh = createCharacterMesh(config.color, 0.9); // Slightly smaller than player
                
                // Random position away from center (where player spawns)
                let x, z;
                do {
                    x = (Math.random() - 0.5) * BOUNDARY * 1.8;
                    z = (Math.random() - 0.5) * BOUNDARY * 1.8;
                } while (Math.sqrt(x*x + z*z) < 10); // Keep away from start

                mesh.position.set(x, 0, z);
                
                // Add simple identifying features based on name (very basic)
                if (config.name === 'Krosh') { // Rabbit ears
                    const ear = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.8), new THREE.MeshStandardMaterial({color: config.color}));
                    ear.position.set(0.3, 1.8, 0);
                    mesh.add(ear);
                    const ear2 = ear.clone();
                    ear2.position.set(-0.3, 1.8, 0);
                    mesh.add(ear2);
                } else if (config.name === 'Nyusha') { // Pig snout
                    const snout = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.1), new THREE.MeshStandardMaterial({color: 0xFF69B4}));
                    snout.rotation.x = Math.PI/2;
                    snout.position.set(0, 0.9, 0.9);
                    mesh.add(snout);
                }

                scene.add(mesh);

                enemies.push({
                    mesh: mesh,
                    name: config.name,
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * ENEMY_SPEED,
                        0,
                        (Math.random() - 0.5) * ENEMY_SPEED
                    ).normalize().multiplyScalar(ENEMY_SPEED)
                });
            }
        }

        function setupInput() {
            // Keyboard
            window.addEventListener('keydown', (e) => {
                if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
            });
            window.addEventListener('keyup', (e) => {
                if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
            });

            // Touch Controls
            const setupBtn = (id, dir) => {
                const btn = document.getElementById(id);
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); touchControls[dir] = true; });
                btn.addEventListener('touchend', (e) => { e.preventDefault(); touchControls[dir] = false; });
                btn.addEventListener('mousedown', (e) => { e.preventDefault(); touchControls[dir] = true; });
                btn.addEventListener('mouseup', (e) => { e.preventDefault(); touchControls[dir] = false; });
                btn.addEventListener('mouseleave', (e) => { e.preventDefault(); touchControls[dir] = false; });
            };
            setupBtn('up-btn', 'up');
            setupBtn('down-btn', 'down');
            setupBtn('left-btn', 'left');
            setupBtn('right-btn', 'right');

            // UI Buttons
            startBtn.addEventListener('click', startGame);
            restartBtn.addEventListener('click', startGame);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function isMobile() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
        }

        function startGame() {
            startModal.style.display = 'none';
            gameOverModal.style.display = 'none';
            
            // Reset state
            score = 0;
            scoreEl.textContent = score;
            totalEnemiesEl.textContent = totalEnemies;
            
            // Reset player
            player.position.set(0, 0, 0);
            player.rotation.set(0, 0, 0);
            
            spawnEnemies();
            
            // Clear particles
            particles.forEach(p => scene.remove(p.mesh));
            particles = [];
            
            gameActive = true;
            lastTime = performance.now();
        }

        function createExplosion(position, color) {
            const particleCount = 20;
            const geo = new THREE.SphereGeometry(0.2, 8, 8);
            const mat = new THREE.MeshBasicMaterial({ color: color });
            
            for (let i = 0; i < particleCount; i++) {
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.copy(position);
                
                // Random velocity outward
                const velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 15,
                    Math.random() * 10 + 5,
                    (Math.random() - 0.5) * 15
                );
                
                scene.add(mesh);
                particles.push({
                    mesh: mesh,
                    velocity: velocity,
                    life: 1.0 // 1 second life
                });
            }
        }

        let lastTime = 0;

        function update(deltaTime) {
            if (!gameActive) return;

            // Player Movement
            const moveDir = new THREE.Vector3(0, 0, 0);
            
            if (keys.ArrowUp || keys.w || touchControls.up) moveDir.z -= 1;
            if (keys.ArrowDown || keys.s || touchControls.down) moveDir.z += 1;
            if (keys.ArrowLeft || keys.a || touchControls.left) moveDir.x -= 1;
            if (keys.ArrowRight || keys.d || touchControls.right) moveDir.x += 1;

            if (moveDir.length() > 0) {
                moveDir.normalize();
                
                // Calculate movement speed based on delta time
                const speed = PLAYER_SPEED * deltaTime;
                player.position.add(moveDir.clone().multiplyScalar(speed));
                
                // Rotate player to face movement direction
                const targetRotation = Math.atan2(moveDir.x, moveDir.z);
                // Simple lerp for smoother rotation
                let currentRotation = player.rotation.y;
                // Handle wrap around
                if (Math.abs(currentRotation - targetRotation) > Math.PI) {
                    if (currentRotation > targetRotation) currentRotation -= Math.PI * 2;
                    else currentRotation += Math.PI * 2;
                }
                player.rotation.y = currentRotation + (targetRotation - currentRotation) * 0.15;
            }

            // Boundary checks for player
            player.position.x = Math.max(-BOUNDARY, Math.min(BOUNDARY, player.position.x));
            player.position.z = Math.max(-BOUNDARY, Math.min(BOUNDARY, player.position.z));

            // Camera follow (Top-down slightly trailing)
            const cameraTargetPos = new THREE.Vector3(
                player.position.x,
                35, // Height
                player.position.z + 15 // Trail slightly behind
            );
            camera.position.lerp(cameraTargetPos, 0.1);
            camera.lookAt(player.position);

            // Enemy Movement & Collision
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                
                // Simple wander behavior (occasionally change direction)
                if (Math.random() < 0.02) {
                    // Turn slightly
                    const turnAngle = (Math.random() - 0.5) * Math.PI / 2;
                    enemy.velocity.applyAxisAngle(new THREE.Vector3(0, 1, 0), turnAngle);
                }

                // Try to avoid player if close (simple flee logic)
                const distToPlayer = enemy.mesh.position.distanceTo(player.position);
                if (distToPlayer < 15) {
                    const fleeDir = new THREE.Vector3().subVectors(enemy.mesh.position, player.position).normalize();
                    fleeDir.y = 0;
                    enemy.velocity.lerp(fleeDir.multiplyScalar(ENEMY_SPEED), 0.1);
                }
                
                // Ensure constant speed
                if (enemy.velocity.lengthSq() > 0) {
                    enemy.velocity.normalize().multiplyScalar(ENEMY_SPEED);
                }

                // Apply movement
                const enemyMove = enemy.velocity.clone().multiplyScalar(deltaTime);
                enemy.mesh.position.add(enemyMove);
                
                // Rotate to face velocity
                if (enemy.velocity.lengthSq() > 0.1) {
                    enemy.mesh.rotation.y = Math.atan2(enemy.velocity.x, enemy.velocity.z);
                }

                // Boundary bounce
                if (enemy.mesh.position.x > BOUNDARY || enemy.mesh.position.x < -BOUNDARY) {
                    enemy.velocity.x *= -1;
                    enemy.mesh.position.x = Math.sign(enemy.mesh.position.x) * BOUNDARY;
                }
                if (enemy.mesh.position.z > BOUNDARY || enemy.mesh.position.z < -BOUNDARY) {
                    enemy.velocity.z *= -1;
                    enemy.mesh.position.z = Math.sign(enemy.mesh.position.z) * BOUNDARY;
                }

                // Check collision with player (simple sphere collision)
                // Sum of radii approx 1.2 (player) + 0.9 (enemy) = 2.1. Use 2.0 for generosity
                if (distToPlayer < 2.0) {
                    // Catch!
                    createExplosion(enemy.mesh.position.clone(), enemy.mesh.children[0].material.color);
                    scene.remove(enemy.mesh);
                    enemies.splice(i, 1);
                    
                    score++;
                    scoreEl.textContent = score;

                    // Add a little bop animation to player
                    player.scale.set(1.2, 0.8, 1.2);
                    setTimeout(() => player.scale.set(1, 1, 1), 150);

                    if (score >= totalEnemies) {
                        endGame();
                    }
                }
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life -= deltaTime;
                
                if (p.life <= 0 || p.mesh.position.y < -1) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                    continue;
                }
                
                // Gravity
                p.velocity.y -= 20 * deltaTime;
                p.mesh.position.add(p.velocity.clone().multiplyScalar(deltaTime));
                
                // Shrink
                p.mesh.scale.setScalar(Math.max(0, p.life));
            }
        }

        function endGame() {
            gameActive = false;
            setTimeout(() => {
                gameOverModal.style.display = 'flex';
            }, 500);
        }

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const deltaTime = Math.min((now - lastTime) / 1000, 0.1); // Cap delta to prevent huge jumps
            lastTime = now;

            update(deltaTime);
            renderer.render(scene, camera);
        }

        // Initialize when window loads
        window.onload = init;

    </script>
</body>
</html>
