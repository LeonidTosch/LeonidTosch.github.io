<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geometry Dash - Remastered</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0b0e14;
            color: #ffffff;
            overflow: hidden;
        }
        .font-game {
            font-family: 'Fredoka One', cursive;
        }
        .text-glow {
            text-shadow: 0 0 12px rgba(59, 130, 246, 0.8), 0 0 24px rgba(147, 51, 234, 0.6);
        }
        .neon-box {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3), inset 0 0 15px rgba(255, 255, 255, 0.1);
        }
        .btn-game {
            transition: all 0.15s ease;
            box-shadow: 0 6px 0 #1e293b, 0 10px 15px rgba(0,0,0,0.4);
        }
        .btn-game:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1e293b, 0 4px 6px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative bg-slate-950">

    <!-- Main Game Canvas Container -->
    <div id="gameContainer" class="relative w-full h-full max-w-6xl max-h-[720px] bg-black sm:rounded-2xl overflow-hidden border-2 border-slate-800 shadow-2xl flex flex-col">
        
        <!-- Canvas Element -->
        <canvas id="gameCanvas" class="w-full h-full block cursor-pointer"></canvas>

        <!-- Top HUD Overlay (In-Game) -->
        <div id="hudOverlay" class="absolute top-0 left-0 right-0 p-4 flex justify-between items-center pointer-events-none hidden">
            <!-- Progress Bar -->
            <div class="flex-1 max-w-xs sm:max-w-md bg-slate-900/80 rounded-full h-5 p-1 border border-slate-700/80 shadow-inner flex items-center mr-4">
                <div id="progressBar" class="bg-gradient-to-r from-cyan-400 via-blue-500 to-indigo-500 h-full rounded-full transition-all duration-75 w-0"></div>
            </div>
            <div class="flex items-center space-x-3 pointer-events-auto">
                <span id="progressText" class="font-game text-xl text-cyan-300 drop-shadow">0%</span>
                <button id="pauseBtn" class="bg-slate-800/90 hover:bg-slate-700 text-white font-bold p-2.5 rounded-xl border border-slate-600 btn-game flex items-center justify-center">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
            </div>
        </div>

        <!-- Practice Mode Controls Overlay -->
        <div id="practiceOverlay" class="absolute top-16 left-4 flex flex-col gap-2 pointer-events-auto hidden">
            <button id="addCheckpointBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-game px-3 py-1.5 rounded-lg text-sm border border-emerald-400 shadow-lg flex items-center gap-1 active:scale-95 transition">
                <span>+ Checkpoint [Z]</span>
            </button>
            <button id="removeCheckpointBtn" class="bg-rose-600 hover:bg-rose-500 text-white font-game px-3 py-1.5 rounded-lg text-sm border border-rose-400 shadow-lg flex items-center gap-1 active:scale-95 transition">
                <span>- Remove [X]</span>
            </button>
        </div>

        <!-- Mobile / Touch Jump Trigger Overlay -->
        <div id="touchTrigger" class="absolute inset-0 z-10 flex items-end justify-end p-6 pointer-events-auto select-none sm:hidden">
            <div class="bg-cyan-500/20 active:bg-cyan-500/40 border-2 border-cyan-400/50 rounded-2xl w-24 h-24 flex items-center justify-center backdrop-blur-sm shadow-lg">
                <span class="font-game text-cyan-200 text-sm tracking-wider">JUMP</span>
            </div>
        </div>

        <!-- Main Menu Overlay -->
        <div id="mainMenu" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-between p-6 z-20">
            <div class="text-center mt-6">
                <h1 class="font-game text-5xl sm:text-7xl bg-gradient-to-r from-cyan-400 via-fuchsia-400 to-amber-300 bg-clip-text text-transparent text-glow tracking-wider">
                    GEOMETRY DASH
                </h1>
                <p class="text-slate-400 mt-2 text-sm sm:text-base font-semibold">REMASTERED CANVAS EDITION</p>
            </div>

            <!-- Level Selector Card Slider -->
            <div class="w-full max-w-xl my-auto">
                <div id="levelCard" class="bg-slate-900 border-2 border-cyan-500/50 rounded-2xl p-6 text-center neon-box relative overflow-hidden transition-all duration-300">
                    <div id="levelBadge" class="inline-block px-3 py-1 rounded-full text-xs font-bold uppercase tracking-widest bg-cyan-500/20 text-cyan-300 mb-3 border border-cyan-400/30">
                        EASY
                    </div>
                    <h2 id="levelTitle" class="font-game text-3xl sm:text-4xl text-white mb-2">1. STEREO MADNESS</h2>
                    <p id="levelDesc" class="text-slate-400 text-sm mb-6">Learn the basics of timing, jump pads, and ship flight.</p>

                    <div class="flex items-center justify-center space-x-6">
                        <button id="prevLevelBtn" class="bg-slate-800 hover:bg-slate-700 text-cyan-400 p-3 rounded-full border border-slate-600 transition active:scale-95">
                            <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                        </button>
                        <button id="playBtn" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-game text-2xl px-10 py-4 rounded-2xl border-2 border-cyan-300 btn-game flex items-center gap-3">
                            <span>PLAY</span>
                            <svg class="w-7 h-7 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                        <button id="nextLevelBtn" class="bg-slate-800 hover:bg-slate-700 text-cyan-400 p-3 rounded-full border border-slate-600 transition active:scale-95">
                            <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Bottom Menu Controls & Options -->
            <div class="w-full max-w-xl flex flex-wrap items-center justify-between gap-4 bg-slate-900/60 p-4 rounded-xl border border-slate-800">
                <label class="flex items-center space-x-3 cursor-pointer">
                    <input type="checkbox" id="practiceToggle" class="w-5 h-5 accent-cyan-500 rounded cursor-pointer">
                    <span class="font-game text-sm text-slate-300">PRACTICE MODE</span>
                </label>
                <div class="flex items-center space-x-3">
                    <button id="soundToggleBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold px-3 py-2 rounded-lg border border-slate-700 flex items-center gap-1.5">
                        <span id="soundIcon">🔊</span> <span id="soundText">SOUND ON</span>
                    </button>
                </div>
            </div>

            <!-- Control instructions footer -->
            <div class="text-center text-xs text-slate-500 tracking-wide mt-2">
                CONTROLS: [SPACE / UP ARROW / LEFT CLICK / TAP] to Jump & Fly | [Z] Checkpoint | [X] Clear Checkpoint
            </div>
        </div>

        <!-- Pause / Game Over Modal Overlay -->
        <div id="modalOverlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center p-6 z-30 hidden">
            <div class="bg-slate-900 border-2 border-slate-700 rounded-2xl p-8 max-w-sm w-full text-center shadow-2xl relative">
                <h2 id="modalTitle" class="font-game text-4xl text-white mb-2">PAUSED</h2>
                <p id="modalSubtitle" class="text-slate-400 text-sm mb-6">Attempt <span id="attemptCountText">1</span></p>

                <div class="flex flex-col space-y-3">
                    <button id="resumeBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-game text-xl py-3 rounded-xl border border-emerald-400 btn-game">
                        RESUME
                    </button>
                    <button id="restartBtn" class="bg-cyan-600 hover:bg-cyan-500 text-white font-game text-xl py-3 rounded-xl border border-cyan-400 btn-game">
                        RESTART
                    </button>
                    <button id="menuBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-game text-lg py-2.5 rounded-xl border border-slate-600 btn-game">
                        MAIN MENU
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Synthesizer Audio System using Web Audio API (No external sound files required)
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
                this.bgmOsc = null;
                this.bgmGain = null;
                this.isPlayingBgm = false;
                this.currentNote = 0;
                this.timer = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playJump() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            }

            playPad() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }

            playOrb() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, this.ctx.currentTime); // C5
                osc.frequency.exponentialRampToValueAtTime(1046.50, this.ctx.currentTime + 0.18); // C6
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.18);
            }

            playPortal() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(600, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }

            playDeath() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);
            }

            playWin() {
                if (!this.enabled || !this.ctx) return;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.1);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.1 + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.1);
                    osc.stop(this.ctx.currentTime + idx * 0.1 + 0.3);
                });
            }

            startBgm(levelIndex) {
                this.stopBgm();
                if (!this.enabled) return;
                this.init();

                const mel1 = [220, 220, 330, 220, 293.66, 220, 261.63, 220]; // Stereo Madness
                const mel2 = [146.83, 220, 174.61, 220, 196.00, 220, 220, 174.61]; // Back on Track
                const mel3 = [130.81, 196, 164.81, 196, 130.81, 261.63, 196, 164.81]; // Polargeist
                const mel = [mel1, mel2, mel3][levelIndex % 3];

                this.isPlayingBgm = true;
                this.currentNote = 0;

                const step = () => {
                    if (!this.isPlayingBgm || !this.ctx) return;
                    const freq = mel[this.currentNote % mel.length];
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    
                    osc.type = (this.currentNote % 4 === 0) ? 'sawtooth' : 'square';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.14);
                    
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.14);

                    this.currentNote++;
                    this.timer = setTimeout(step, 140);
                };
                step();
            }

            stopBgm() {
                this.isPlayingBgm = false;
                if (this.timer) clearTimeout(this.timer);
            }
        }

        const sound = new SoundEngine();

        // Levels definition - Obstacles placed with FIRST SPIKE FAR AT X=960 (24 grid units)
        const GRID_SIZE = 40;

        function createLevel1() {
            // Stereo Madness: Intro runway, distant first spike at x=960
            const objects = [];
            
            // Ground blocks & distant first spikes
            // Free safe zone from x=0 to x=900!
            objects.push({ type: 'spike', x: 960, y: 0 }); // First spike far away!
            objects.push({ type: 'spike', x: 1200, y: 0 });
            
            // Block stepping
            objects.push({ type: 'block', x: 1400, y: 0 });
            objects.push({ type: 'block', x: 1440, y: 0 });
            objects.push({ type: 'block', x: 1480, y: 0 });
            objects.push({ type: 'spike', x: 1480, y: 1 }); // Spike on block
            
            // Pad jump section
            objects.push({ type: 'pad_yellow', x: 1700, y: 0 });
            objects.push({ type: 'block', x: 1880, y: 2 });
            objects.push({ type: 'block', x: 1920, y: 2 });
            
            // Ship transformation portal
            objects.push({ type: 'portal_ship', x: 2200, y: 1 });
            
            // Ship cavern obstacles
            objects.push({ type: 'block', x: 2500, y: 0 });
            objects.push({ type: 'block', x: 2500, y: 1 });
            objects.push({ type: 'block', x: 2500, y: 5 });
            objects.push({ type: 'block', x: 2500, y: 6 });

            objects.push({ type: 'block', x: 2800, y: 0 });
            objects.push({ type: 'block', x: 2800, y: 4 });
            objects.push({ type: 'block', x: 2800, y: 5 });
            objects.push({ type: 'block', x: 2800, y: 6 });

            // Cube transformation back
            objects.push({ type: 'portal_cube', x: 3200, y: 1 });

            // Yellow Orbs in air
            objects.push({ type: 'orb_yellow', x: 3500, y: 2 });
            objects.push({ type: 'spike', x: 3500, y: 0 });

            objects.push({ type: 'orb_yellow', x: 3800, y: 2 });
            objects.push({ type: 'spike', x: 3800, y: 0 });
            objects.push({ type: 'spike', x: 3840, y: 0 });

            // Final staircase
            for(let i = 0; i < 5; i++) {
                objects.push({ type: 'block', x: 4200 + i*80, y: i });
            }
            objects.push({ type: 'pad_yellow', x: 4600, y: 4 });

            return { title: '1. STEREO MADNESS', difficulty: 'EASY', color: '#06b6d4', length: 5200, objects };
        }

        function createLevel2() {
            // Back on Track: Pads, Gravity Flip, Wave Mode
            const objects = [];
            // Safe zone up to x=1000
            objects.push({ type: 'spike', x: 1000, y: 0 });
            objects.push({ type: 'pad_yellow', x: 1160, y: 0 });
            
            // Floating platform with orb
            objects.push({ type: 'block', x: 1360, y: 2 });
            objects.push({ type: 'block', x: 1400, y: 2 });
            objects.push({ type: 'orb_pink', x: 1550, y: 3 });
            objects.push({ type: 'spike', x: 1550, y: 0 });

            // Wave Portal
            objects.push({ type: 'portal_wave', x: 1800, y: 1 });
            
            // Wave zigzag tunnel
            for(let x = 2000; x < 3200; x += 160) {
                const top = Math.sin(x / 200) > 0 ? 5 : 6;
                const btm = Math.sin(x / 200) > 0 ? 1 : 0;
                objects.push({ type: 'block', x, y: btm });
                objects.push({ type: 'block', x, y: top });
            }

            // Cube portal
            objects.push({ type: 'portal_cube', x: 3400, y: 1 });
            
            // Gravity flip portal
            objects.push({ type: 'portal_gravity_up', x: 3700, y: 1 });
            objects.push({ type: 'spike', x: 4000, y: 6 }); // upside down spike
            objects.push({ type: 'portal_gravity_down', x: 4300, y: 5 });

            return { title: '2. BACK ON TRACK', difficulty: 'MEDIUM', color: '#10b981', length: 5000, objects };
        }

        function createLevel3() {
            // Polargeist: High rhythm, rapid mode switches
            const objects = [];
            // Safe zone up to x=960
            objects.push({ type: 'spike', x: 960, y: 0 });
            objects.push({ type: 'spike', x: 1000, y: 0 });
            
            objects.push({ type: 'orb_yellow', x: 1200, y: 1 });
            objects.push({ type: 'orb_yellow', x: 1400, y: 2 });
            objects.push({ type: 'orb_yellow', x: 1600, y: 3 });
            
            objects.push({ type: 'portal_ship', x: 1800, y: 1 });
            objects.push({ type: 'spike', x: 2100, y: 0 });
            objects.push({ type: 'spike', x: 2100, y: 6 });
            objects.push({ type: 'spike', x: 2400, y: 0 });
            objects.push({ type: 'spike', x: 2400, y: 6 });

            objects.push({ type: 'portal_wave', x: 2700, y: 3 });
            objects.push({ type: 'portal_cube', x: 3600, y: 1 });

            for(let x = 3800; x < 4800; x += 200) {
                objects.push({ type: 'pad_pink', x, y: 0 });
            }

            return { title: '3. POLARGEIST', difficulty: 'HARD', color: '#8b5cf6', length: 5400, objects };
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game State Variables
        let levels = [createLevel1(), createLevel2(), createLevel3()];
        let currentLevelIdx = 0;
        let gameState = 'MENU'; // 'MENU', 'PLAYING', 'PAUSED', 'GAMEOVER', 'VICTORY'
        let isPracticeMode = false;
        let attempts = 1;

        // Player Physical Properties
        const player = {
            x: 100,
            y: 0,
            vx: 6.8, // Horizontal run speed
            vy: 0,
            size: 34,
            rotation: 0,
            mode: 'cube', // 'cube', 'ship', 'wave'
            gravityDir: 1, // 1 = normal down, -1 = upside down
            isGrounded: false,
            trail: []
        };

        // Checkpoints array for Practice Mode
        let checkpoints = [];

        // Camera Offset
        let cameraX = 0;

        // Particles system
        let particles = [];

        // Input Buffer (Guarantees responsiveness)
        const inputs = {
            jumpHold: false,
            jumpPressedFrame: false
        };

        // Unified Input Handlers (Keyboard + Pointer + Touch)
        function triggerJumpStart() {
            sound.init();
            inputs.jumpHold = true;
            inputs.jumpPressedFrame = true;
        }

        function triggerJumpEnd() {
            inputs.jumpHold = false;
        }

        // Global Event Listeners
        window.addEventListener('keydown', (e) => {
            if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
                e.preventDefault(); // Prevent page scrolling
                if (!e.repeat) {
                    triggerJumpStart();
                }
            } else if (e.code === 'KeyZ' && isPracticeMode && gameState === 'PLAYING') {
                addCheckpoint();
            } else if (e.code === 'KeyX' && isPracticeMode && gameState === 'PLAYING') {
                removeCheckpoint();
            } else if (e.code === 'KeyP' || e.code === 'Escape') {
                togglePause();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
                e.preventDefault();
                triggerJumpEnd();
            }
        });

        // Pointer / Mouse / Touch triggers
        const touchTrigger = document.getElementById('touchTrigger');
        
        [canvas, touchTrigger].forEach(element => {
            element.addEventListener('pointerdown', (e) => {
                if (e.target.closest('button')) return; // Don't trigger jump on UI button click
                e.preventDefault();
                triggerJumpStart();
            });

            element.addEventListener('pointerup', (e) => {
                if (e.target.closest('button')) return;
                e.preventDefault();
                triggerJumpEnd();
            });

            element.addEventListener('pointercancel', triggerJumpEnd);
        });

        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function getGroundY() {
            return canvas.height - 110;
        }

        function addCheckpoint() {
            checkpoints.push({
                x: player.x,
                y: player.y,
                vy: player.vy,
                mode: player.mode,
                gravityDir: player.gravityDir,
                rotation: player.rotation
            });
            createParticles(player.x, player.y, '#10b981', 12);
        }

        function removeCheckpoint() {
            if (checkpoints.length > 0) {
                checkpoints.pop();
                createParticles(player.x, player.y, '#f43f5e', 12);
            }
        }

        function restoreLastCheckpoint() {
            if (checkpoints.length > 0 && isPracticeMode) {
                const cp = checkpoints[checkpoints.length - 1];
                player.x = cp.x;
                player.y = cp.y;
                player.vy = cp.vy;
                player.mode = cp.mode;
                player.gravityDir = cp.gravityDir;
                player.rotation = cp.rotation;
                return true;
            }
            return false;
        }

        function resetPlayer() {
            player.x = 100;
            player.y = getGroundY() - player.size;
            player.vy = 0;
            player.rotation = 0;
            player.mode = 'cube';
            player.gravityDir = 1;
            player.isGrounded = true;
            player.trail = [];
        }

        function startLevel() {
            const lvl = levels[currentLevelIdx];
            resetPlayer();
            checkpoints = [];
            gameState = 'PLAYING';
            
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('modalOverlay').classList.add('hidden');
            document.getElementById('hudOverlay').classList.remove('hidden');
            
            if (isPracticeMode) {
                document.getElementById('practiceOverlay').classList.remove('hidden');
            } else {
                document.getElementById('practiceOverlay').classList.add('hidden');
            }

            sound.startBgm(currentLevelIdx);
        }

        function triggerDeath() {
            sound.playDeath();
            createParticles(player.x + player.size/2, player.y + player.size/2, '#ef4444', 30);

            if (isPracticeMode && restoreLastCheckpoint()) {
                // Checkpoint restored successfully
                return;
            }

            attempts++;
            gameState = 'GAMEOVER';
            sound.stopBgm();

            document.getElementById('modalTitle').textContent = "CRASHED!";
            document.getElementById('modalTitle').className = "font-game text-4xl text-rose-500 mb-2";
            document.getElementById('modalSubtitle').textContent = `Attempt ${attempts}`;
            document.getElementById('modalOverlay').classList.remove('hidden');
        }

        function triggerWin() {
            sound.playWin();
            gameState = 'VICTORY';
            sound.stopBgm();

            document.getElementById('modalTitle').textContent = "LEVEL COMPLETE!";
            document.getElementById('modalTitle').className = "font-game text-4xl text-amber-400 mb-2";
            document.getElementById('modalSubtitle').textContent = `Total Attempts: ${attempts}`;
            document.getElementById('modalOverlay').classList.remove('hidden');
        }

        function createParticles(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    size: Math.random() * 5 + 3,
                    color,
                    life: 1.0
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - cameraX, p.y, p.size, p.size);
                ctx.restore();
            });
        }

        function updatePhysics() {
            if (gameState !== 'PLAYING') return;

            const lvl = levels[currentLevelIdx];
            const groundY = getGroundY();

            // Constant forward movement
            player.x += player.vx;

            // Player trail calculation
            player.trail.push({ x: player.x, y: player.y, rot: player.rotation });
            if (player.trail.length > 8) player.trail.shift();

            // Mode specific gravity & input handling
            if (player.mode === 'cube') {
                // Apply Gravity
                const g = 0.85 * player.gravityDir;
                player.vy += g;

                // Ground landing check
                if (player.gravityDir === 1 && player.y >= groundY - player.size) {
                    player.y = groundY - player.size;
                    player.vy = 0;
                    player.isGrounded = true;
                    player.rotation = Math.round(player.rotation / (Math.PI / 2)) * (Math.PI / 2); // Snap alignment
                } else if (player.gravityDir === -1 && player.y <= 0) {
                    player.y = 0;
                    player.vy = 0;
                    player.isGrounded = true;
                    player.rotation = Math.round(player.rotation / (Math.PI / 2)) * (Math.PI / 2);
                } else {
                    player.isGrounded = false;
                    player.rotation += 0.15 * player.gravityDir; // Rotate in air
                }

                // Jump logic
                if ((inputs.jumpHold || inputs.jumpPressedFrame) && player.isGrounded) {
                    player.vy = -13.5 * player.gravityDir;
                    player.isGrounded = false;
                    sound.playJump();
                    createParticles(player.x + player.size/2, player.y + player.size, '#38bdf8', 6);
                }

            } else if (player.mode === 'ship') {
                // Ship flight physics
                if (inputs.jumpHold) {
                    player.vy -= 0.65 * player.gravityDir; // Lift upward
                } else {
                    player.vy += 0.55 * player.gravityDir; // Fall downward
                }
                
                // Terminal velocity limit
                player.vy = Math.max(-8, Math.min(8, player.vy));
                player.rotation = player.vy * 0.06;

                // Ceiling and floor bounds
                if (player.y >= groundY - player.size) {
                    player.y = groundY - player.size;
                    player.vy = 0;
                }
                if (player.y <= 0) {
                    player.y = 0;
                    player.vy = 0;
                }

            } else if (player.mode === 'wave') {
                // Wave diagonal sharp zig-zag
                if (inputs.jumpHold) {
                    player.vy = -7.5 * player.gravityDir;
                    player.rotation = -Math.PI / 4 * player.gravityDir;
                } else {
                    player.vy = 7.5 * player.gravityDir;
                    player.rotation = Math.PI / 4 * player.gravityDir;
                }

                // Wave ceiling and floor check
                if (player.y >= groundY - player.size) {
                    triggerDeath();
                    return;
                }
                if (player.y <= 0) {
                    triggerDeath();
                    return;
                }
            }

            // Apply vertical speed
            player.y += player.vy;

            // Camera follow with smooth leading offset
            cameraX = player.x - 180;

            // Check collisions with level objects
            const playerBox = {
                left: player.x + 4,
                right: player.x + player.size - 4,
                top: player.y + 4,
                bottom: player.y + player.size - 4
            };

            lvl.objects.forEach(obj => {
                const objX = obj.x;
                const objY = groundY - (obj.y + 1) * GRID_SIZE;
                const objSize = GRID_SIZE;

                // Fast distance bounding box check
                if (Math.abs(player.x - objX) > 100) return;

                if (obj.type === 'block') {
                    // Block collision (Top, Bottom, Sides)
                    const blockBox = { left: objX, right: objX + objSize, top: objY, bottom: objY + objSize };

                    if (playerBox.right > blockBox.left && playerBox.left < blockBox.right &&
                        playerBox.bottom > blockBox.top && playerBox.top < blockBox.bottom) {
                        
                        // Check if landed on top
                        if (player.vy >= 0 && (player.y + player.size - player.vy) <= blockBox.top + 10) {
                            player.y = blockBox.top - player.size;
                            player.vy = 0;
                            player.isGrounded = true;
                            player.rotation = Math.round(player.rotation / (Math.PI / 2)) * (Math.PI / 2);
                        } else {
                            // Hit side of block
                            triggerDeath();
                        }
                    }
                } else if (obj.type === 'spike') {
                    // Spike collision (Triangle hit detection)
                    if (playerBox.right > objX + 8 && playerBox.left < objX + objSize - 8 &&
                        playerBox.bottom > objY + 8 && playerBox.top < objY + objSize) {
                        triggerDeath();
                    }
                } else if (obj.type === 'pad_yellow') {
                    // Pad Bounce
                    if (playerBox.right > objX && playerBox.left < objX + objSize &&
                        playerBox.bottom >= objY + 20) {
                        player.vy = -18 * player.gravityDir;
                        sound.playPad();
                        createParticles(objX + 20, objY + 20, '#facc15', 12);
                    }
                } else if (obj.type === 'pad_pink') {
                    if (playerBox.right > objX && playerBox.left < objX + objSize &&
                        playerBox.bottom >= objY + 20) {
                        player.vy = -14 * player.gravityDir;
                        sound.playPad();
                        createParticles(objX + 20, objY + 20, '#f472b6', 12);
                    }
                } else if (obj.type.startsWith('orb_')) {
                    // Jump Orb activation on input press
                    if (inputs.jumpPressedFrame &&
                        Math.hypot((player.x + player.size/2) - (objX + 20), (player.y + player.size/2) - (objY + 20)) < 40) {
                        if (obj.type === 'orb_yellow') player.vy = -14 * player.gravityDir;
                        if (obj.type === 'orb_pink') player.vy = -11 * player.gravityDir;
                        sound.playOrb();
                        createParticles(objX + 20, objY + 20, '#38bdf8', 15);
                    }
                } else if (obj.type.startsWith('portal_')) {
                    // Portal transformations
                    if (Math.abs((player.x + player.size/2) - (objX + 20)) < 30) {
                        if (obj.type === 'portal_ship') player.mode = 'ship';
                        if (obj.type === 'portal_cube') player.mode = 'cube';
                        if (obj.type === 'portal_wave') player.mode = 'wave';
                        if (obj.type === 'portal_gravity_up') player.gravityDir = -1;
                        if (obj.type === 'portal_gravity_down') player.gravityDir = 1;
                        sound.playPortal();
                        createParticles(objX + 20, objY + 20, '#c084fc', 15);
                    }
                }
            });

            // Level Completion Check
            const progress = Math.min(100, Math.floor((player.x / lvl.length) * 100));
            document.getElementById('progressBar').style.width = `${progress}%`;
            document.getElementById('progressText').textContent = `${progress}%`;

            if (player.x >= lvl.length) {
                triggerWin();
            }

            // Clear frame trigger buffer
            inputs.jumpPressedFrame = false;
        }

        function drawBackground() {
            const lvl = levels[currentLevelIdx];
            
            // Dynamic theme background gradient
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#020617');
            grad.addColorStop(0.7, lvl.color + '22');
            grad.addColorStop(1, '#0f172a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Parallax Grid Effect
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            const gridOffset = cameraX * 0.3 % 40;
            
            for (let x = -gridOffset; x < canvas.width; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }

            // Render Animated Floor
            const groundY = getGroundY();
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

            // Glowing floor top line
            ctx.shadowColor = lvl.color;
            ctx.shadowBlur = 12;
            ctx.strokeStyle = lvl.color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(canvas.width, groundY);
            ctx.stroke();
            ctx.shadowBlur = 0; // Reset blur
        }

        function drawLevelObjects() {
            const lvl = levels[currentLevelIdx];
            const groundY = getGroundY();

            lvl.objects.forEach(obj => {
                const screenX = obj.x - cameraX;
                const screenY = groundY - (obj.y + 1) * GRID_SIZE;

                // Offscreen culling optimization
                if (screenX < -60 || screenX > canvas.width + 60) return;

                if (obj.type === 'block') {
                    // Cyber Neon Block Texture
                    ctx.fillStyle = '#1e293b';
                    ctx.fillRect(screenX, screenY, GRID_SIZE, GRID_SIZE);
                    ctx.strokeStyle = lvl.color;
                    ctx.lineWidth = 2;
                    ctx.strokeRect(screenX + 2, screenY + 2, GRID_SIZE - 4, GRID_SIZE - 4);

                } else if (obj.type === 'spike') {
                    // Metallic Neon Spike
                    ctx.fillStyle = '#f43f5e';
                    ctx.beginPath();
                    ctx.moveTo(screenX + GRID_SIZE/2, screenY);
                    ctx.lineTo(screenX + GRID_SIZE, screenY + GRID_SIZE);
                    ctx.lineTo(screenX, screenY + GRID_SIZE);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                } else if (obj.type.startsWith('pad_')) {
                    // Jump Pad
                    const color = obj.type === 'pad_yellow' ? '#facc15' : '#f472b6';
                    ctx.fillStyle = color;
                    ctx.fillRect(screenX + 4, screenY + 30, GRID_SIZE - 8, 10);
                    ctx.shadowColor = color;
                    ctx.shadowBlur = 10;
                    ctx.fillRect(screenX + 8, screenY + 26, GRID_SIZE - 16, 4);
                    ctx.shadowBlur = 0;

                } else if (obj.type.startsWith('orb_')) {
                    // Pulsing Jump Orb
                    const color = obj.type === 'orb_yellow' ? '#facc15' : '#38bdf8';
                    const pulse = Math.sin(Date.now() / 150) * 3;
                    ctx.fillStyle = color;
                    ctx.beginPath();
                    ctx.arc(screenX + 20, screenY + 20, 12 + pulse, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                } else if (obj.type.startsWith('portal_')) {
                    // Vehicle & Gravity Portals
                    let color = '#38bdf8';
                    if (obj.type === 'portal_ship') color = '#c084fc';
                    if (obj.type === 'portal_wave') color = '#f59e0b';
                    if (obj.type.includes('gravity')) color = '#10b981';

                    ctx.strokeStyle = color;
                    ctx.lineWidth = 4;
                    ctx.shadowColor = color;
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.ellipse(screenX + 20, screenY + 20, 16, 36, 0, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
            });

            // Draw Practice Mode Checkpoint Markers
            checkpoints.forEach(cp => {
                const screenX = cp.x - cameraX;
                if (screenX > -20 && screenX < canvas.width + 20) {
                    ctx.fillStyle = '#10b981';
                    ctx.beginPath();
                    ctx.arc(screenX + player.size/2, cp.y + player.size/2, 8, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function drawPlayer() {
            if (gameState === 'GAMEOVER') return;

            const screenX = player.x - cameraX;
            const screenY = player.y;

            // Draw Motion Trail
            player.trail.forEach((t, i) => {
                ctx.save();
                ctx.globalAlpha = (i / player.trail.length) * 0.4;
                ctx.fillStyle = '#38bdf8';
                ctx.fillRect(t.x - cameraX, t.y, player.size, player.size);
                ctx.restore();
            });

            ctx.save();
            ctx.translate(screenX + player.size / 2, screenY + player.size / 2);
            ctx.rotate(player.rotation);

            if (player.mode === 'cube') {
                // Iconic Geometry Dash Glowing Cube Texture
                ctx.fillStyle = '#facc15';
                ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
                
                ctx.fillStyle = '#0284c7';
                ctx.fillRect(-player.size/4, -player.size/4, player.size/2, player.size/2);

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2.5;
                ctx.strokeRect(-player.size/2, -player.size/2, player.size, player.size);

                // Eyes
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(-8, -8, 6, 6);
                ctx.fillRect(2, -8, 6, 6);

            } else if (player.mode === 'ship') {
                // Rocket Ship Texture
                ctx.fillStyle = '#c084fc';
                ctx.beginPath();
                ctx.moveTo(player.size/2, 0);
                ctx.lineTo(-player.size/2, -player.size/3);
                ctx.lineTo(-player.size/2, player.size/3);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

            } else if (player.mode === 'wave') {
                // Dart Wave Texture
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath();
                ctx.moveTo(player.size/2, 0);
                ctx.lineTo(-player.size/2, -player.size/2);
                ctx.lineTo(-player.size/4, 0);
                ctx.lineTo(-player.size/2, player.size/2);
                ctx.closePath();
                ctx.fill();
            }

            ctx.restore();
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'PLAYING') {
                updatePhysics();
                updateParticles();
            }

            drawBackground();
            drawLevelObjects();
            drawParticles();
            drawPlayer();

            requestAnimationFrame(gameLoop);
        }

        // UI Navigation Logic
        function updateLevelCard() {
            const lvl = levels[currentLevelIdx];
            document.getElementById('levelTitle').textContent = lvl.title;
            document.getElementById('levelTitle').style.color = lvl.color;
            document.getElementById('levelBadge').textContent = lvl.difficulty;
            document.getElementById('levelCard').style.borderColor = lvl.color;
        }

        document.getElementById('prevLevelBtn').addEventListener('click', () => {
            currentLevelIdx = (currentLevelIdx - 1 + levels.length) % levels.length;
            updateLevelCard();
        });

        document.getElementById('nextLevelBtn').addEventListener('click', () => {
            currentLevelIdx = (currentLevelIdx + 1) % levels.length;
            updateLevelCard();
        });

        document.getElementById('practiceToggle').addEventListener('change', (e) => {
            isPracticeMode = e.target.checked;
        });

        document.getElementById('soundToggleBtn').addEventListener('click', () => {
            sound.enabled = !sound.enabled;
            document.getElementById('soundText').textContent = sound.enabled ? 'SOUND ON' : 'MUTED';
            document.getElementById('soundIcon').textContent = sound.enabled ? '🔊' : 'MUTE';
            if (!sound.enabled) sound.stopBgm();
        });

        document.getElementById('playBtn').addEventListener('click', () => {
            attempts = 1;
            startLevel();
        });

        function togglePause() {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                sound.stopBgm();
                document.getElementById('modalTitle').textContent = "PAUSED";
                document.getElementById('modalTitle').className = "font-game text-4xl text-white mb-2";
                document.getElementById('modalSubtitle').textContent = `Attempt ${attempts}`;
                document.getElementById('modalOverlay').classList.remove('hidden');
            } else if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
                sound.startBgm(currentLevelIdx);
                document.getElementById('modalOverlay').classList.add('hidden');
            }
        }

        document.getElementById('pauseBtn').addEventListener('click', togglePause);
        document.getElementById('resumeBtn').addEventListener('click', togglePause);

        document.getElementById('restartBtn').addEventListener('click', () => {
            startLevel();
        });

        document.getElementById('menuBtn').addEventListener('click', () => {
            gameState = 'MENU';
            sound.stopBgm();
            document.getElementById('modalOverlay').classList.add('hidden');
            document.getElementById('hudOverlay').classList.add('hidden');
            document.getElementById('practiceOverlay').classList.add('hidden');
            document.getElementById('mainMenu').classList.remove('hidden');
        });

        document.getElementById('addCheckpointBtn').addEventListener('click', addCheckpoint);
        document.getElementById('removeCheckpointBtn').addEventListener('click', removeCheckpoint);

        // Start animation loop on window load
        window.onload = () => {
            updateLevelCard();
            gameLoop();
        };
    </script>
</body>
</html>
