<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geometry Dash Deluxe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Pusab&family=Rubik:wght@700;900&display=swap');

        body {
            font-family: 'Rubik', sans-serif;
            background-color: #0d0e15;
            color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            touch-action: manipulation;
        }

        .font-gd {
            font-family: 'Fredoka One', cursive, sans-serif;
            letter-spacing: 1px;
            text-shadow: 3px 3px 0px #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 4px 10px rgba(0,0,0,0.7);
        }

        .gd-btn {
            transition: transform 0.1s ease, filter 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 6px 0 rgba(0,0,0,0.4), inset 0 3px 0 rgba(255,255,255,0.4);
        }

        .gd-btn:hover {
            transform: translateY(-2px) scale(1.03);
            filter: brightness(1.15);
        }

        .gd-btn:active {
            transform: translateY(4px) scale(0.97);
            box-shadow: 0 2px 0 rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
        }

        /* Pulse glow for main menu title */
        @keyframes pulseGlow {
            0%, 100% { text-shadow: 0 0 20px #00f3ff, 3px 3px 0px #000, -2px -2px 0 #000; }
            50% { text-shadow: 0 0 35px #ff00ea, 3px 3px 0px #000, -2px -2px 0 #000; }
        }

        .animate-title {
            animation: pulseGlow 3s infinite alternate ease-in-out;
        }

        canvas {
            image-rendering: pixelated;
            touch-action: none;
        }
    </style>
</head>

    <script>
        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.isPlayingMusic = false;
                this.musicTimer = null;
                this.tempo = 130;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playJump() {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.12);
                    
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.12);
                } catch(e) {}
            }

            playOrbJump() {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.15);

                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.15);
                } catch(e) {}
            }

            playPortal() {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.25);

                    gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.25);
                } catch(e) {}
            }

            playDeath() {
                if (this.muted || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    // Explosion noise simulation
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + 0.35);

                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(now + 0.35);
                } catch(e) {}
            }

            playWin() {
                if (this.muted || !this.ctx) return;
                try {
                    const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
                    notes.forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);

                        gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.08 + 0.2);

                        osc.connect(gain);
                        gain.connect(this.ctx.destination);

                        osc.start(this.ctx.currentTime + idx * 0.08);
                        osc.stop(this.ctx.currentTime + idx * 0.08 + 0.2);
                    });
                } catch(e) {}
            }

            startMusic(levelIdx = 0) {
                this.stopMusic();
                if (this.muted || !this.ctx) return;

                this.isPlayingMusic = true;
                let step = 0;

                // Bassline frequencies for synth music
                const scale1 = [110, 110, 130.81, 110, 146.83, 130.81, 110, 98.00];
                const scale2 = [130.81, 130.81, 164.81, 130.81, 196.00, 164.81, 130.81, 110];
                const scale3 = [146.83, 146.83, 174.61, 146.83, 220.00, 174.61, 146.83, 130.81];
                const activeScale = levelIdx === 0 ? scale1 : (levelIdx === 1 ? scale2 : scale3);

                const interval = (60 / this.tempo / 2) * 1000;

                this.musicTimer = setInterval(() => {
                    if (!this.isPlayingMusic || !this.ctx) return;
                    try {
                        const now = this.ctx.currentTime;
                        const freq = activeScale[step % activeScale.length];

                        // Bass Synth Note
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = step % 4 === 0 ? 'sawtooth' : 'square';
                        osc.frequency.setValueAtTime(freq, now);

                        gain.gain.setValueAtTime(0.08, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

                        osc.connect(gain);
                        gain.connect(this.ctx.destination);

                        osc.start(now);
                        osc.stop(now + 0.18);

                        // Hi-hat pulse on offbeats
                        if (step % 2 === 1) {
                            const hatOsc = this.ctx.createOscillator();
                            const hatGain = this.ctx.createGain();
                            hatOsc.type = 'square';
                            hatOsc.frequency.setValueAtTime(8000, now);
                            hatGain.gain.setValueAtTime(0.02, now);
                            hatGain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                            hatOsc.connect(hatGain);
                            hatGain.connect(this.ctx.destination);
                            hatOsc.start(now);
                            hatOsc.stop(now + 0.04);
                        }

                        step++;
                    } catch(e) {}
                }, interval);
            }

            stopMusic() {
                this.isPlayingMusic = false;
                if (this.musicTimer) {
                    clearInterval(this.musicTimer);
                    this.musicTimer = null;
                }
            }
        }

        const audio = new AudioEngine();

        class GeometryDashGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');

                this.currentLevelIdx = 0;
                this.practiceMode = false;
                this.attempts = 1;
                this.bestProgress = [0, 0, 0];

                // Player Skins & Customization
                this.primaryColors = ['#00f3ff', '#ff00ea', '#00ff66', '#ffaa00', '#ff0044', '#ffffff'];
                this.secondaryColors = ['#ffff00', '#00ffff', '#ff0055', '#00ffaa', '#111111', '#9900ff'];
                this.selectedPrimary = '#00f3ff';
                this.selectedSecondary = '#ffff00';
                this.selectedFace = 0; // 0: Normal, 1: Happy, 2: Angry

                // State
                this.gameState = 'MENU'; // MENU, PLAYING, PAUSED, DEAD, WIN
                this.checkpoints = [];

                // Player physics parameters
                this.resetPlayer();

                // Camera & Particles
                this.cameraX = 0;
                this.particles = [];
                this.deathParticles = [];

                // Input handling
                this.isJumpPressed = false;

                this.setupCanvas();
                this.bindEvents();
                this.loadSavedData();
                this.renderSkinPreview();

                // Loop
                this.lastTime = performance.now();
                requestAnimationFrame((t) => this.loop(t));
            }

            setupCanvas() {
                const rect = this.canvas.parentElement.getBoundingClientRect();
                this.canvas.width = rect.width || 960;
                this.canvas.height = rect.height || 540;
                this.scale = this.canvas.height / 360; // Base reference height 360px
            }

            loadSavedData() {
                try {
                    const saved = localStorage.getItem('gd_remastered_save');
                    if (saved) {
                        const data = JSON.parse(saved);
                        if (data.bestProgress) this.bestProgress = data.bestProgress;
                        if (data.primary) this.selectedPrimary = data.primary;
                        if (data.secondary) this.selectedSecondary = data.secondary;
                        if (data.face !== undefined) this.selectedFace = data.face;
                    }
                } catch(e) {}
                this.updateLevelUI();
            }

            saveData() {
                try {
                    localStorage.setItem('gd_remastered_save', JSON.stringify({
                        bestProgress: this.bestProgress,
                        primary: this.selectedPrimary,
                        secondary: this.selectedSecondary,
                        face: this.selectedFace
                    }));
                } catch(e) {}
            }

            resetPlayer() {
                this.player = {
                    x: 100,
                    y: 0, // Y=0 is ground level in game coordinates
                    vx: 7.5, // Forward speed
                    vy: 0,
                    mode: 'cube', // 'cube', 'ship', 'wave'
                    size: 34,
                    rotation: 0,
                    grounded: true,
                    dead: false,
                    gravity: -1.1,
                    jumpForce: 14.5,
                    shipFlyForce: 0.7,
                    waveDir: 1 // 1 for down, -1 for up
                };
            }

            bindEvents() {
                window.addEventListener('resize', () => this.setupCanvas());

                // Keypress controls
                const handleKeyDown = (e) => {
                    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                        if (!this.isJumpPressed) {
                            this.isJumpPressed = true;
                            this.triggerJumpAction();
                        }
                        if (['Space', 'ArrowUp'].includes(e.code)) e.preventDefault();
                    }
                    if (e.code === 'KeyZ' && this.gameState === 'PLAYING' && this.practiceMode) {
                        this.setCheckpoint();
                    }
                    if (e.code === 'KeyX' && this.gameState === 'PLAYING' && this.practiceMode) {
                        this.removeCheckpoint();
                    }
                    if (e.code === 'KeyP' || e.code === 'Escape') {
                        if (this.gameState === 'PLAYING') this.pauseGame();
                        else if (this.gameState === 'PAUSED') this.resumeGame();
                    }
                };

                const handleKeyUp = (e) => {
                    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                        this.isJumpPressed = false;
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                window.addEventListener('keyup', handleKeyUp);

                // Mouse / Touch Controls on Canvas
                const handlePointerDown = (e) => {
                    if (this.gameState !== 'PLAYING') return;
                    this.isJumpPressed = true;
                    this.triggerJumpAction();
                };

                const handlePointerUp = () => {
                    this.isJumpPressed = false;
                };

                this.canvas.addEventListener('mousedown', handlePointerDown);
                this.canvas.addEventListener('mouseup', handlePointerUp);
                this.canvas.addEventListener('touchstart', (e) => {
                    handlePointerDown(e);
                    e.preventDefault();
                }, { passive: false });
                this.canvas.addEventListener('touchend', handlePointerUp);

                // UI Button Listeners
                document.getElementById('btn-prev-level').onclick = () => this.changeLevel(-1);
                document.getElementById('btn-next-level').onclick = () => this.changeLevel(1);

                document.getElementById('btn-play-normal').onclick = () => this.startGame(false);
                document.getElementById('btn-play-practice').onclick = () => this.startGame(true);

                document.getElementById('btn-pause').onclick = () => this.pauseGame();
                document.getElementById('btn-resume').onclick = () => this.resumeGame();
                document.getElementById('btn-restart').onclick = () => this.startGame(this.practiceMode);
                document.getElementById('btn-exit-main').onclick = () => this.showMainMenu();

                document.getElementById('btn-complete-restart').onclick = () => this.startGame(this.practiceMode);
                document.getElementById('btn-complete-next').onclick = () => {
                    this.changeLevel(1);
                    this.startGame(false);
                };

                document.getElementById('btn-practice-checkpoint').onclick = () => this.setCheckpoint();
                document.getElementById('btn-practice-remove').onclick = () => this.removeCheckpoint();

                // Sound Toggle
                document.getElementById('btn-toggle-sound').onclick = () => {
                    audio.init();
                    audio.muted = !audio.muted;
                    const icon = document.getElementById('sound-icon');
                    const btn = document.getElementById('btn-toggle-sound');
                    if (audio.muted) {
                        icon.className = 'fa-solid fa-volume-xmark text-slate-400';
                        btn.classList.add('opacity-70');
                    } else {
                        icon.className = 'fa-solid fa-volume-high text-cyan-400';
                        btn.classList.remove('opacity-70');
                        if (this.gameState === 'PLAYING') audio.startMusic(this.currentLevelIdx);
                    }
                };

                // Skins modal listeners
                document.getElementById('btn-open-skins').onclick = () => {
                    document.getElementById('menu-skins').classList.remove('hidden');
                };
                document.getElementById('btn-close-skins').onclick = () => {
                    document.getElementById('menu-skins').classList.add('hidden');
                    this.saveData();
                };

                this.setupSkinSelectors();
            }

            setupSkinSelectors() {
                const primContainer = document.getElementById('primary-colors-grid');
                primContainer.innerHTML = '';
                this.primaryColors.forEach(c => {
                    const btn = document.createElement('button');
                    btn.className = 'w-9 h-9 rounded-xl border-2 border-white/40 shadow-md transition-transform active:scale-95';
                    btn.style.backgroundColor = c;
                    btn.onclick = () => {
                        this.selectedPrimary = c;
                        this.renderSkinPreview();
                    };
                    primContainer.appendChild(btn);
                });

                const secContainer = document.getElementById('secondary-colors-grid');
                secContainer.innerHTML = '';
                this.secondaryColors.forEach(c => {
                    const btn = document.createElement('button');
                    btn.className = 'w-9 h-9 rounded-xl border-2 border-white/40 shadow-md transition-transform active:scale-95';
                    btn.style.backgroundColor = c;
                    btn.onclick = () => {
                        this.selectedSecondary = c;
                        this.renderSkinPreview();
                    };
                    secContainer.appendChild(btn);
                });

                const faceContainer = document.getElementById('face-styles-grid');
                faceContainer.innerHTML = '';
                ['Normal', 'Happy', 'Angry'].forEach((faceName, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'px-3 py-1.5 rounded-xl bg-slate-800 border border-slate-600 text-xs font-bold hover:bg-slate-700';
                    btn.innerText = faceName;
                    btn.onclick = () => {
                        this.selectedFace = idx;
                        this.renderSkinPreview();
                    };
                    faceContainer.appendChild(btn);
                });
            }

            renderSkinPreview() {
                const prevCanvas = document.getElementById('skin-preview-canvas');
                const ctx = prevCanvas.getContext('2d');
                ctx.clearRect(0, 0, 80, 80);
                this.drawPlayerIcon(ctx, 40, 40, 50, 0, 'cube');
            }

            changeLevel(dir) {
                this.currentLevelIdx = (this.currentLevelIdx + dir + LEVELS.length) % LEVELS.length;
                this.updateLevelUI();
            }

            updateLevelUI() {
                const lvl = LEVELS[this.currentLevelIdx];
                document.getElementById('level-title').innerText = lvl.name;
                document.getElementById('level-difficulty-badge').innerText = lvl.difficulty;
                document.getElementById('level-best-bar').style.width = `${this.bestProgress[this.currentLevelIdx]}%`;
                document.getElementById('level-best-text').innerText = `BEST: ${this.bestProgress[this.currentLevelIdx]}%`;
            }

            startGame(isPractice = false) {
                audio.init();
                this.practiceMode = isPractice;
                this.gameState = 'PLAYING';
                this.attempts = 1;
                this.checkpoints = [];

                this.resetPlayer();

                // UI setup
                document.getElementById('menu-main').classList.add('hidden');
                document.getElementById('menu-pause').classList.add('hidden');
                document.getElementById('menu-complete').classList.add('hidden');
                document.getElementById('hud').classList.remove('opacity-0');

                const cpBtn = document.getElementById('btn-practice-checkpoint');
                const rmBtn = document.getElementById('btn-practice-remove');
                if (this.practiceMode) {
                    cpBtn.classList.remove('hidden');
                    rmBtn.classList.remove('hidden');
                } else {
                    cpBtn.classList.add('hidden');
                    rmBtn.classList.add('hidden');
                }

                audio.startMusic(this.currentLevelIdx);
            }

            pauseGame() {
                if (this.gameState !== 'PLAYING') return;
                this.gameState = 'PAUSED';
                document.getElementById('menu-pause').classList.remove('hidden');
                audio.stopMusic();
            }

            resumeGame() {
                if (this.gameState !== 'PAUSED') return;
                this.gameState = 'PLAYING';
                document.getElementById('menu-pause').classList.add('hidden');
                audio.startMusic(this.currentLevelIdx);
            }

            showMainMenu() {
                this.gameState = 'MENU';
                audio.stopMusic();
                document.getElementById('menu-main').classList.remove('hidden');
                document.getElementById('menu-pause').classList.add('hidden');
                document.getElementById('menu-complete').classList.add('hidden');
                document.getElementById('hud').classList.add('opacity-0');
            }

            setCheckpoint() {
                if (!this.practiceMode || this.gameState !== 'PLAYING') return;
                this.checkpoints.push({
                    player: { ...this.player },
                    cameraX: this.cameraX
                });
                // Small visual particle feedback
                this.addCheckpointParticle();
            }

            removeCheckpoint() {
                if (!this.practiceMode || this.checkpoints.length === 0) return;
                this.checkpoints.pop();
            }

            addCheckpointParticle() {
                this.particles.push({
                    x: this.player.x,
                    y: this.player.y + 20,
                    vx: 0, vy: 2,
                    size: 15,
                    color: '#00ff66',
                    life: 1.0
                });
            }

            triggerJumpAction() {
                if (this.gameState !== 'PLAYING') return;

                const p = this.player;

                // Check orb interactions
                const level = LEVELS[this.currentLevelIdx];
                for (let obj of level.objects) {
                    if (obj.type.startsWith('orb_')) {
                        const dist = Math.hypot((p.x + p.size/2) - (obj.x + 20), (p.y + p.size/2) - (obj.y + 20));
                        if (dist < 45) {
                            if (obj.type === 'orb_yellow') {
                                p.vy = p.jumpForce * 1.1;
                                audio.playOrbJump();
                                this.createPulseParticles(obj.x + 20, obj.y + 20, '#ffff00');
                                return;
                            }
                        }
                    }
                }

                // Normal jump execution
                if (p.mode === 'cube') {
                    if (p.grounded) {
                        p.vy = p.jumpForce;
                        p.grounded = false;
                        audio.playJump();
                    }
                }
            }

            updatePlayer() {
                if (this.gameState !== 'PLAYING') return;

                const p = this.player;
                const level = LEVELS[this.currentLevelIdx];

                // Forward movement
                p.x += p.vx;

                // Mode-specific Movement & Gravity
                if (p.mode === 'cube') {
                    p.vy += p.gravity;
                    p.y += p.vy;

                    // Cube Rotation logic
                    if (!p.grounded) {
                        p.rotation += 8; // Rotate clockwise in air
                    } else {
                        // Snap rotation to nearest 90 degrees on ground
                        p.rotation = Math.round(p.rotation / 90) * 90;
                    }

                    // Auto-jump if jump button held
                    if (this.isJumpPressed && p.grounded) {
                        p.vy = p.jumpForce;
                        p.grounded = false;
                        audio.playJump();
                    }
                } 
                else if (p.mode === 'ship') {
                    if (this.isJumpPressed) {
                        p.vy += p.shipFlyForce;
                    } else {
                        p.vy += p.gravity * 0.6;
                    }
                    // Terminal velocity cap
                    p.vy = Math.max(-10, Math.min(10, p.vy));
                    p.y += p.vy;

                    // Ship tilt angle based on vertical velocity
                    p.rotation = p.vy * 3;
                }
                else if (p.mode === 'wave') {
                    if (this.isJumpPressed) {
                        p.y += p.vx * 0.85; // Move up at 45 degree angle
                        p.rotation = -45;
                    } else {
                        p.y -= p.vx * 0.85; // Move down at 45 degree angle
                        p.rotation = 45;
                    }
                }

                // Floor collision (y = 0)
                if (p.y <= 0) {
                    p.y = 0;
                    p.vy = 0;
                    p.grounded = true;
                } else {
                    p.grounded = false;
                }

                // Ceiling cap
                if (p.y > 300) {
                    p.y = 300;
                    p.vy = 0;
                }

                // Object Collision Detection
                const playerBox = { x: p.x, y: p.y, width: p.size, height: p.size };

                for (let obj of level.objects) {
                    // Quick distance cull optimization
                    if (Math.abs(obj.x - p.x) > 200) continue;

                    if (obj.type === 'spike') {
                        // Hitbox for triangle spike
                        if (this.checkSpikeCollision(playerBox, obj)) {
                            this.handleDeath();
                            return;
                        }
                    } 
                    else if (obj.type === 'block') {
                        const blockBox = { x: obj.x, y: obj.y, width: TILE, height: TILE };
                        if (this.checkAABB(playerBox, blockBox)) {
                            // Determine collision direction
                            const prevY = p.y - p.vy;
                            if (prevY >= obj.y + TILE - 5) {
                                // Landed on top of block
                                p.y = obj.y + TILE;
                                p.vy = 0;
                                p.grounded = true;
                            } else {
                                // Hit side of block -> Crash!
                                this.handleDeath();
                                return;
                            }
                        }
                    }
                    else if (obj.type === 'pad_yellow') {
                        const padBox = { x: obj.x, y: obj.y, width: TILE, height: 15 };
                        if (this.checkAABB(playerBox, padBox)) {
                            p.vy = p.jumpForce * 1.35;
                            p.grounded = false;
                            audio.playOrbJump();
                            this.createPulseParticles(obj.x + 20, obj.y + 10, '#ffff00');
                        }
                    }
                    else if (obj.type.startsWith('portal_')) {
                        const portalBox = { x: obj.x, y: obj.y, width: 30, height: 90 };
                        if (this.checkAABB(playerBox, portalBox)) {
                            const newMode = obj.type.replace('portal_', '');
                            if (p.mode !== newMode) {
                                p.mode = newMode;
                                audio.playPortal();
                                this.createPulseParticles(obj.x + 15, obj.y + 45, '#00f3ff');
                            }
                        }
                    }
                    else if (obj.type === 'finish') {
                        if (p.x >= obj.x) {
                            this.handleWin();
                            return;
                        }
                    }
                }

                // Update Camera
                this.cameraX = p.x - 150;

                // Trail Particles
                if (Math.random() < 0.6) {
                    this.particles.push({
                        x: p.x,
                        y: p.y + p.size/2,
                        vx: -2 + (Math.random() - 0.5),
                        vy: (Math.random() - 0.5) * 2,
                        size: 6 + Math.random() * 4,
                        color: this.selectedPrimary,
                        life: 1.0
                    });
                }

                // Update particles
                this.updateParticles();

                // Calculate level percentage completion
                const finishObj = level.objects.find(o => o.type === 'finish');
                const totalDist = finishObj ? finishObj.x : 4000;
                const pct = Math.min(100, Math.floor((p.x / totalDist) * 100));

                document.getElementById('progress-bar').style.width = `${pct}%`;
                document.getElementById('progress-text').innerText = `${pct}%`;

                if (pct > this.bestProgress[this.currentLevelIdx]) {
                    this.bestProgress[this.currentLevelIdx] = pct;
                    this.saveData();
                }
            }

            checkAABB(a, b) {
                return (
                    a.x < b.x + b.width &&
                    a.x + a.width > b.x &&
                    a.y < b.y + b.height &&
                    a.y + a.height > b.y
                );
            }

            checkSpikeCollision(player, spike) {
                // Generous slightly inner bounding triangle check for fair gameplay
                const pad = 6;
                const pLeft = player.x + pad;
                const pRight = player.x + player.width - pad;
                const pBottom = player.y + pad;
                const pTop = player.y + player.height - pad;

                const sLeft = spike.x;
                const sRight = spike.x + TILE;
                const sBottom = spike.y;
                const sTop = spike.y + TILE;

                return (pRight > sLeft && pLeft < sRight && pBottom < sTop && pTop > sBottom);
            }

            handleDeath() {
                audio.playDeath();
                this.createDeathExplosion();

                if (this.practiceMode && this.checkpoints.length > 0) {
                    // Respawn at latest checkpoint
                    const cp = this.checkpoints[this.checkpoints.length - 1];
                    this.player = { ...cp.player };
                    this.cameraX = cp.cameraX;
                    this.attempts++;
                } else {
                    // Restart from start
                    this.resetPlayer();
                    this.attempts++;
                }
            }

            handleWin() {
                audio.stopMusic();
                audio.playWin();
                this.gameState = 'WIN';

                this.bestProgress[this.currentLevelIdx] = 100;
                this.saveData();

                document.getElementById('complete-stats').innerText = `Attempts: ${this.attempts} | Mode: ${this.practiceMode ? 'Practice' : 'Normal'}`;
                document.getElementById('menu-complete').classList.remove('hidden');
            }

            createDeathExplosion() {
                for (let i = 0; i < 35; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 3 + Math.random() * 8;
                    this.deathParticles.push({
                        x: this.player.x + this.player.size/2,
                        y: this.player.y + this.player.size/2,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        size: 6 + Math.random() * 8,
                        color: Math.random() > 0.5 ? this.selectedPrimary : this.selectedSecondary,
                        life: 1.0
                    });
                }
            }

            createPulseParticles(x, y, color) {
                for (let i = 0; i < 12; i++) {
                    const angle = (i / 12) * Math.PI * 2;
                    this.particles.push({
                        x: x, y: y,
                        vx: Math.cos(angle) * 4,
                        vy: Math.sin(angle) * 4,
                        size: 5,
                        color: color,
                        life: 1.0
                    });
                }
            }

            updateParticles() {
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const pt = this.particles[i];
                    pt.x += pt.vx;
                    pt.y += pt.vy;
                    pt.life -= 0.04;
                    if (pt.life <= 0) this.particles.splice(i, 1);
                }

                for (let i = this.deathParticles.length - 1; i >= 0; i--) {
                    const pt = this.deathParticles[i];
                    pt.x += pt.vx;
                    pt.y += pt.vy;
                    pt.life -= 0.025;
                    if (pt.life <= 0) this.deathParticles.splice(i, 1);
                }
            }

            render() {
                const ctx = this.ctx;
                const W = this.canvas.width;
                const H = this.canvas.height;

                ctx.save();
                ctx.scale(this.scale, this.scale);
                const viewW = W / this.scale;
                const viewH = H / this.scale;

                const level = LEVELS[this.currentLevelIdx];

                // 1. Draw Background Gradient
                const bgGrad = ctx.createLinearGradient(0, 0, 0, viewH);
                bgGrad.addColorStop(0, level.bgGradient[0]);
                bgGrad.addColorStop(1, level.bgGradient[1]);
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, viewW, viewH);

                // Grid Lines background effect
                ctx.strokeStyle = "rgba(255, 255, 255, 0.04)";
                ctx.lineWidth = 1;
                const gridOffset = (-this.cameraX * 0.3) % 40;
                for (let x = gridOffset; x < viewW; x += 40) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, viewH);
                    ctx.stroke();
                }

                // Game Coordinate System Transform: Y=0 is near bottom of canvas
                const groundY = viewH - 60;

                // 2. Draw Objects
                for (let obj of level.objects) {
                    const screenX = obj.x - this.cameraX;
                    if (screenX < -100 || screenX > viewW + 100) continue;

                    const screenY = groundY - obj.y - TILE;

                    if (obj.type === 'spike') {
                        ctx.fillStyle = '#ff0055';
                        ctx.shadowColor = '#ff0055';
                        ctx.shadowBlur = 10;
                        ctx.beginPath();
                        ctx.moveTo(screenX + TILE/2, screenY);
                        ctx.lineTo(screenX + TILE, screenY + TILE);
                        ctx.lineTo(screenX, screenY + TILE);
                        ctx.closePath();
                        ctx.fill();
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                        ctx.shadowBlur = 0;
                    }
                    else if (obj.type === 'block') {
                        ctx.fillStyle = '#0f172a';
                        ctx.fillRect(screenX, screenY, TILE, TILE);
                        ctx.strokeStyle = level.floorColor;
                        ctx.lineWidth = 2.5;
                        ctx.strokeRect(screenX, screenY, TILE, TILE);
                        
                        // Inner cross icon
                        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                        ctx.beginPath();
                        ctx.moveTo(screenX, screenY); ctx.lineTo(screenX + TILE, screenY + TILE);
                        ctx.moveTo(screenX + TILE, screenY); ctx.lineTo(screenX, screenY + TILE);
                        ctx.stroke();
                    }
                    else if (obj.type === 'pad_yellow') {
                        ctx.fillStyle = '#ffff00';
                        ctx.shadowColor = '#ffff00';
                        ctx.shadowBlur = 12;
                        ctx.fillRect(screenX + 5, groundY - obj.y - 10, TILE - 10, 10);
                        ctx.shadowBlur = 0;
                    }
                    else if (obj.type.startsWith('orb_')) {
                        ctx.fillStyle = '#ffff00';
                        ctx.shadowColor = '#ffff00';
                        ctx.shadowBlur = 15;
                        ctx.beginPath();
                        ctx.arc(screenX + 20, groundY - obj.y - 20, 14, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                        ctx.shadowBlur = 0;
                    }
                    else if (obj.type.startsWith('portal_')) {
                        const portalColor = obj.type.includes('ship') ? '#ff00ea' : (obj.type.includes('wave') ? '#00f3ff' : '#00ff66');
                        ctx.fillStyle = portalColor;
                        ctx.shadowColor = portalColor;
                        ctx.shadowBlur = 20;
                        ctx.fillRect(screenX, groundY - obj.y - 90, 25, 90);
                        ctx.shadowBlur = 0;
                    }
                    else if (obj.type === 'finish') {
                        ctx.fillStyle = '#00ff66';
                        ctx.fillRect(screenX, 0, 10, viewH);
                    }
                }

                // 3. Draw Checkpoints in Practice Mode
                if (this.practiceMode) {
                    for (let cp of this.checkpoints) {
                        const screenX = cp.player.x - this.cameraX;
                        if (screenX >= -20 && screenX <= viewW + 20) {
                            ctx.fillStyle = '#00ff66';
                            ctx.beginPath();
                            ctx.arc(screenX, groundY - cp.player.y - 15, 8, 0, Math.PI*2);
                            ctx.fill();
                        }
                    }
                }

                // 4. Draw Particles & Death Effects
                for (let pt of this.particles) {
                    ctx.fillStyle = pt.color;
                    ctx.globalAlpha = pt.life;
                    ctx.fillRect(pt.x - this.cameraX, groundY - pt.y - pt.size, pt.size, pt.size);
                }

                for (let pt of this.deathParticles) {
                    ctx.fillStyle = pt.color;
                    ctx.globalAlpha = pt.life;
                    ctx.fillRect(pt.x - this.cameraX, groundY - pt.y - pt.size, pt.size, pt.size);
                }
                ctx.globalAlpha = 1.0;

                // 5. Draw Player (if alive)
                if (this.gameState === 'PLAYING' || this.gameState === 'PAUSED') {
                    const p = this.player;
                    const screenX = p.x - this.cameraX;
                    const screenY = groundY - p.y - p.size;

                    this.drawPlayerIcon(ctx, screenX + p.size/2, screenY + p.size/2, p.size, p.rotation, p.mode);
                }

                // 6. Draw Textured Floor
                ctx.fillStyle = '#0b0f19';
                ctx.fillRect(0, groundY, viewW, 60);

                ctx.strokeStyle = level.floorColor;
                ctx.shadowColor = level.floorColor;
                ctx.shadowBlur = 12;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(0, groundY);
                ctx.lineTo(viewW, groundY);
                ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.restore();
            }

            drawPlayerIcon(ctx, centerX, centerY, size, rotation, mode) {
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate((rotation * Math.PI) / 180);

                if (mode === 'ship') {
                    // Draw outer ship pod outline
                    ctx.fillStyle = this.selectedSecondary;
                    ctx.beginPath();
                    ctx.ellipse(0, 5, size*0.7, size*0.35, 0, 0, Math.PI*2);
                    ctx.fill();
                }

                // Main Square / Cube Body
                const half = size / 2;
                ctx.fillStyle = this.selectedPrimary;
                ctx.fillRect(-half, -half, size, size);

                // Inner Secondary Accent Square
                ctx.fillStyle = this.selectedSecondary;
                ctx.fillRect(-half + 5, -half + 5, size - 10, size - 10);

                // Core Black Square
                ctx.fillStyle = '#0d0e15';
                ctx.fillRect(-half + 9, -half + 9, size - 18, size - 18);

                // Eye / Face expression
                ctx.fillStyle = '#ffffff';
                if (this.selectedFace === 0) {
                    // Normal Eyes
                    ctx.fillRect(-half + 11, -half + 12, 5, 8);
                    ctx.fillRect(half - 16, -half + 12, 5, 8);
                } else if (this.selectedFace === 1) {
                    // Happy Eyes
                    ctx.fillRect(-half + 11, -half + 12, 5, 5);
                    ctx.fillRect(half - 16, -half + 12, 5, 5);
                    ctx.fillRect(-half + 12, half - 15, 10, 3);
                } else {
                    // Angry Eyes
                    ctx.fillRect(-half + 10, -half + 14, 6, 6);
                    ctx.fillRect(half - 16, -half + 14, 6, 6);
                }

                ctx.restore();
            }

            loop(time) {
                const dt = time - this.lastTime;
                this.lastTime = time;

                if (this.gameState === 'PLAYING') {
                    this.updatePlayer();
                }

                this.render();
                requestAnimationFrame((t) => this.loop(t));
            }
        }

        // Initialize Game on Window Load
        window.onload = () => {
            window.game = new GeometryDashGame();
        };
    </script>
</body>
</html>
