<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geometry Dash 2D: Neon Apex</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #030308;
            font-family: 'Rajdhani', sans-serif;
            color: #fff;
        }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        
        /* Glassmorphism UI Panels */
        .glass-panel {
            background: rgba(12, 14, 28, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 240, 255, 0.15);
        }
        
        .glow-text-cyan {
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.8), 0 0 20px rgba(0, 240, 255, 0.4);
        }
        .glow-text-pink {
            text-shadow: 0 0 10px rgba(255, 0, 128, 0.8), 0 0 20px rgba(255, 0, 128, 0.4);
        }
        .glow-text-gold {
            text-shadow: 0 0 10px rgba(255, 200, 0, 0.8), 0 0 20px rgba(255, 200, 0, 0.4);
        }

        /* Buttons & Interactions */
        .btn-action {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-action:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.8);
        }
        .btn-action:active {
            transform: translateY(1px) scale(0.98);
        }

        .level-card {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.4) 100%);
        }
        .level-card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: rgba(0, 240, 255, 0.6);
            box-shadow: 0 12px 30px rgba(0, 240, 255, 0.25);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        ::-webkit-scrollbar-thumb { background: rgba(0,240,255,0.4); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,240,255,0.8); }

        /* Custom pulse animation */
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        .animate-pulse-glow {
            animation: pulseGlow 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="w-screen h-screen overflow-hidden select-none">

    <div id="game-container" class="relative w-full h-full bg-black">
        <!-- Canvas for rendering 2D Lights, Mirroring & Dash Gameplay -->
        <canvas id="game-canvas" class="block w-full h-full cursor-pointer"></canvas>

        <!-- UI Overlay Layer -->
        <div id="ui-overlay" class="absolute inset-0 pointer-events-none flex flex-col justify-between p-4 md:p-6 z-10">
            <!-- HUD Header -->
            <div id="hud" class="flex justify-between items-center opacity-0 transition-opacity duration-300 pointer-events-auto">
                <div class="flex items-center space-x-3">
                    <button id="btn-hud-pause" class="p-2.5 rounded-xl glass-panel text-white hover:text-cyan-400 transition-colors">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <div class="glass-panel px-4 py-1.5 rounded-xl">
                        <span class="text-xs text-gray-400 uppercase tracking-widest block font-bold">Attempt</span>
                        <span id="hud-attempt" class="orbitron text-lg font-bold text-cyan-400">1</span>
                    </div>
                </div>

                <div class="glass-panel px-6 py-2 rounded-xl text-center min-w-[180px]">
                    <div id="hud-level-title" class="orbitron text-sm font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500">
                        LEVEL 1: NEON BEGINNINGS
                    </div>
                </div>

                <div class="glass-panel px-4 py-1.5 rounded-xl text-right">
                    <span class="text-xs text-gray-400 uppercase tracking-widest block font-bold">Progress</span>
                    <span id="hud-percent" class="orbitron text-lg font-bold text-emerald-400">0%</span>
                </div>
            </div>

            <!-- Progress Bar Bottom -->
            <div id="hud-progress-container" class="w-full max-w-3xl mx-auto opacity-0 transition-opacity duration-300">
                <div class="h-2.5 w-full bg-gray-900/80 rounded-full p-0.5 border border-cyan-500/30 overflow-hidden shadow-[0_0_15px_rgba(0,240,255,0.2)]">
                    <div id="hud-progress-bar" class="h-full bg-gradient-to-r from-cyan-400 via-pink-500 to-yellow-400 rounded-full w-0 transition-all duration-75"></div>
                </div>
            </div>
        </div>

        <div id="screen-main-menu" class="absolute inset-0 z-20 flex flex-col items-center justify-between p-6 bg-gradient-to-b from-black/80 via-slate-950/90 to-black pointer-events-auto">
            <!-- Title Header -->
            <div class="text-center mt-6 md:mt-10">
                <div class="inline-block px-4 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-xs orbitron tracking-widest mb-3 animate-pulse">
                    ULTRA HIGH GRAPHICS • DYNAMIC MIRROR LIGHTING
                </div>
                <h1 class="orbitron text-4xl sm:text-6xl md:text-7xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-fuchsia-500 to-yellow-400 drop-shadow-[0_0_25px_rgba(0,240,255,0.6)]">
                    GEOMETRY DASH
                </h1>
                <p class="orbitron text-lg md:text-2xl font-bold tracking-widest text-pink-400 glow-text-pink mt-1">
                    2D NEON APEX

            </div>

            <!-- Level Selector Grid -->
            <div class="w-full max-w-5xl my-auto py-4">
                <div class="flex justify-between items-center mb-4 px-2">
                    <h2 class="orbitron text-xl font-bold text-white flex items-center gap-2">
                        <span class="w-2 h-6 bg-cyan-400 rounded-full inline-block"></span>
                        SELECT LEVEL (10 BIG LEVELS)
                    </h2>
                    <span id="total-stars-display" class="glass-panel px-4 py-1 rounded-full text-yellow-400 orbitron text-sm font-bold flex items-center gap-1">
                        ★ <span id="stars-count">0</span> / 30
                    </span>
                </div>

                <div id="level-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 max-h-[50vh] sm:max-h-[55vh] overflow-y-auto p-2">
                    <!-- Populated dynamically via JavaScript -->
                </div>
            </div>

            <!-- Footer Menu Action Buttons -->
            <div class="flex flex-wrap justify-center gap-4 mb-4">
                <button id="btn-open-customize" class="glass-panel px-6 py-3 rounded-2xl hover:border-cyan-400 transition-all flex items-center gap-2 font-bold text-white text-sm orbitron">
                    <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"/></svg>
                    CUSTOMIZE CUBE
                </button>
                <button id="btn-toggle-sfx" class="glass-panel px-6 py-3 rounded-2xl hover:border-pink-400 transition-all flex items-center gap-2 font-bold text-white text-sm orbitron">
                    <span id="sfx-icon">🔊</span> AUDIO: ON
                </button>
                <button id="btn-toggle-graphics" class="glass-panel px-6 py-3 rounded-2xl hover:border-yellow-400 transition-all flex items-center gap-2 font-bold text-white text-sm orbitron">
                    ✨ BLOOM & MIRROR: MAX
                </button>
            </div>
        </div>

        <div id="screen-customize" class="absolute inset-0 z-30 hidden flex flex-col items-center justify-center p-6 bg-black/90 backdrop-blur-xl">
            <div class="glass-panel max-w-xl w-full p-6 rounded-3xl border border-cyan-500/30 flex flex-col items-center">
                <h2 class="orbitron text-2xl font-black text-cyan-400 mb-6 glow-text-cyan">CUBE CUSTOMIZATION</h2>
                
                <!-- Preview Canvas -->
                <div class="relative w-32 h-32 bg-slate-900 rounded-2xl border-2 border-cyan-400/50 flex items-center justify-center shadow-[0_0_30px_rgba(0,240,255,0.3)] mb-6">
                    <canvas id="custom-preview-canvas" width="100" height="100"></canvas>
                </div>

                <!-- Color Options -->
                <div class="w-full space-y-4 mb-8">
                    <div>

                        <div id="primary-colors" class="flex flex-wrap gap-3 justify-center"></div>
                    </div>
                    <div>
                        <label class="block orbitron text-xs font-bold text-gray-400 mb-2">GLOW ACCENT COLOR</label>

                    </div>
                    <div>
                        <label class="block orbitron text-xs font-bold text-gray-400 mb-2">TRAIL STYLE</label>

                </div>

                <button id="btn-close-customize" class="btn-action w-full py-3.5 rounded-2xl orbitron font-bold text-black tracking-wider text-base">
                    SAVE & CONTINUE

            </div>
        </div>

        <div id="screen-pause" class="absolute inset-0 z-30 hidden flex flex-col items-center justify-center p-6 bg-black/80 backdrop-blur-md">
            <div class="glass-panel max-w-sm w-full p-8 rounded-3xl text-center space-y-5 border border-cyan-500/30">
                <h2 class="orbitron text-3xl font-black text-white tracking-widest glow-text-cyan">PAUSED</h2>
                <div class="space-y-3 pt-2">
                    <button id="btn-resume" class="btn-action w-full py-3.5 rounded-2xl orbitron font-bold text-black tracking-wider">RESUME</button>
                    <button id="btn-restart" class="w-full py-3 rounded-2xl glass-panel font-bold text-white orbitron border-cyan-500/30 hover:bg-cyan-500/20">RESTART LEVEL</button>
                    <button id="btn-exit-menu" class="w-full py-3 rounded-2xl glass-panel font-bold text-gray-300 orbitron border-red-500/30 hover:bg-red-500/20 hover:text-white">MAIN MENU</button>
                </div>
            </div>
        </div>

        <div id="screen-game-over" class="absolute inset-0 z-30 hidden flex flex-col items-center justify-center p-6 bg-black/75 backdrop-blur-md pointer-events-auto">
            <div class="glass-panel max-w-md w-full p-8 rounded-3xl text-center border border-red-500/40 shadow-[0_0_50px_rgba(255,0,80,0.3)]">
                <h2 class="orbitron text-4xl font-black text-red-500 tracking-wider mb-2 drop-shadow-[0_0_20px_rgba(255,0,80,0.8)]">CRASHED!</h2>
                <p id="death-percent-text" class="orbitron text-2xl font-bold text-white mb-6">45% COMPLETED</p>
                <div class="space-y-3">
                    <button id="btn-retry" class="btn-action w-full py-4 rounded-2xl orbitron font-bold text-black tracking-wider text-lg shadow-[0_0_25px_rgba(0,242,254,0.6)]">
                        TRY AGAIN (SPACE/CLICK)
                    </button>
                    <button id="btn-death-menu" class="w-full py-3 rounded-2xl glass-panel font-bold text-gray-300 orbitron hover:bg-white/10">
                        LEVEL SELECT
                    </button>
                </div>
            </div>
        </div>

        <div id="screen-victory" class="absolute inset-0 z-30 hidden flex flex-col items-center justify-center p-6 bg-black/85 backdrop-blur-xl">
            <div class="glass-panel max-w-md w-full p-8 rounded-3xl text-center border border-emerald-400/50 shadow-[0_0_60px_rgba(16,185,129,0.4)]">
                <div class="text-yellow-400 text-5xl mb-2 animate-bounce">★ ★ ★</div>
                <h2 class="orbitron text-4xl font-black text-emerald-400 tracking-wider mb-2 glow-text-gold">LEVEL COMPLETE!</h2>
                <p id="victory-attempts" class="orbitron text-lg font-bold text-gray-200 mb-6">ATTEMPTS: 12</p>
                <div class="space-y-3">
                    <button id="btn-next-level" class="btn-action w-full py-4 rounded-2xl orbitron font-bold text-black tracking-wider text-lg bg-gradient-to-r from-emerald-400 to-cyan-400">
                        NEXT LEVEL
                    </button>
                    <button id="btn-victory-menu" class="w-full py-3 rounded-2xl glass-panel font-bold text-gray-300 orbitron hover:bg-white/10">
                        MAIN MENU
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
    /* =========================================================================
       AUDIO SYNTHESIZER & SOUND EFFECTS (Zero External Asset Dependency)
       ========================================================================= */
    class SoundEngine {
        constructor() {
            this.ctx = null;
            this.enabled = true;
            this.bgmNode = null;
            this.isPlayingBGM = false;
            this.currentBeat = 0;
            this.bgmInterval = null;
        }

        init() {
            if (!this.ctx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) this.ctx = new AudioCtx();
            }
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
        }

        playTone(freq, type, duration, vol = 0.1, freqSlide = 0) {
            if (!this.enabled || !this.ctx) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                if (freqSlide !== 0) {
                    osc.frequency.exponentialRampToValueAtTime(Math.max(10, freq + freqSlide), this.ctx.currentTime + duration);
                }
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            } catch (e) {}
        }

        playJump() {
            this.playTone(180, 'square', 0.15, 0.12, 350);
        }

        playOrb() {
            this.playTone(400, 'sine', 0.2, 0.15, 600);
        }

        playPad() {
            this.playTone(300, 'triangle', 0.25, 0.2, 800);
        }

        playDeath() {
            if (!this.enabled || !this.ctx) return;
            try {
                // Noise burst for shatter explosion
                const bufferSize = this.ctx.sampleRate * 0.3;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }
                const whiteNoise = this.ctx.createBufferSource();
                whiteNoise.buffer = buffer;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1200, this.ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.3);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);

                whiteNoise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                whiteNoise.start();
            } catch (e) {}
        }

        playVictory() {
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, i) => {
                setTimeout(() => this.playTone(freq, 'triangle', 0.3, 0.15), i * 120);
            });
        }

        startBGM(bpm = 130, colorTheme = 'cyan') {
            this.stopBGM();
            if (!this.enabled) return;
            this.init();

            const beatDuration = (60 / bpm) / 4; // 16th notes
            let step = 0;

            const bassFreqs = [65.41, 65.41, 77.78, 87.31]; // C2, D#2, F2
            const leadNotes = [261.63, 311.13, 392.00, 466.16, 523.25];

            this.bgmInterval = setInterval(() => {
                if (!this.enabled || !this.ctx) return;
                
                // Kick drum on quarters
                if (step % 4 === 0) {
                    this.playTone(130, 'sine', 0.12, 0.22, -100);
                }
                // Off-beat synth hat
                if (step % 2 === 1) {
                    this.playTone(8000, 'square', 0.03, 0.03);
                }
                // Bass synth drive
                if (step % 2 === 0) {
                    const freq = bassFreqs[Math.floor(step / 8) % bassFreqs.length];
                    this.playTone(freq, 'sawtooth', 0.15, 0.08);
                }
                // Lead melody accent
                if (step % 8 === 6 || step % 16 === 14) {
                    const lead = leadNotes[(step + Math.floor(step / 4)) % leadNotes.length];
                    this.playTone(lead, 'triangle', 0.2, 0.06);
                }

                step = (step + 1) % 64;
            }, beatDuration * 1000);
            this.isPlayingBGM = true;
        }

        stopBGM() {
            if (this.bgmInterval) {
                clearInterval(this.bgmInterval);
                this.bgmInterval = null;
            }
            this.isPlayingBGM = false;
        }
    }

    const audio = new SoundEngine();

    const LEVEL_THEMES = [
        { name: "NEON BEGINNINGS", difficulty: "EASY", stars: 1, bg: "#030712", primary: "#00f2fe", secondary: "#4facfe", mirror: "rgba(0,242,254,0.15)", bpm: 125, length: 2800 },
        { name: "OVERDRIVE", difficulty: "EASY", stars: 2, bg: "#0f051d", primary: "#ff007f", secondary: "#7928ca", mirror: "rgba(255,0,127,0.15)", bpm: 130, length: 3200 },
        { name: "SUB ZERO", difficulty: "NORMAL", stars: 2, bg: "#021526", primary: "#00fff0", secondary: "#0088ff", mirror: "rgba(0,255,240,0.18)", bpm: 132, length: 3500 },
        { name: "INFERNO RUN", difficulty: "NORMAL", stars: 3, bg: "#1a0404", primary: "#ff3300", secondary: "#ffaa00", mirror: "rgba(255,51,0,0.18)", bpm: 135, length: 3800 },
        { name: "CYBER HELL", difficulty: "HARD", stars: 3, bg: "#12001a", primary: "#bf00ff", secondary: "#00ff66", mirror: "rgba(191,0,255,0.18)", bpm: 138, length: 4200 },
        { name: "MATRIX CODE", difficulty: "HARD", stars: 4, bg: "#001208", primary: "#00ff44", secondary: "#006622", mirror: "rgba(0,255,68,0.18)", bpm: 140, length: 4500 },
        { name: "SOLAR FLARE", difficulty: "HARDER", stars: 4, bg: "#1c1000", primary: "#ffbb00", secondary: "#ff4400", mirror: "rgba(255,187,0,0.18)", bpm: 142, length: 4800 },
        { name: "QUANTUM VOID", difficulty: "INSANE", stars: 5, bg: "#080014", primary: "#8a2be2", secondary: "#00ffff", mirror: "rgba(138,43,226,0.18)", bpm: 145, length: 5200 },
        { name: "TOXIC HAZARD", difficulty: "INSANE", stars: 5, bg: "#0d1400", primary: "#a6ff00", secondary: "#ff0055", mirror: "rgba(166,255,0,0.18)", bpm: 148, length: 5600 },
        { name: "OMNI FINALE", difficulty: "DEMON", stars: 6, bg: "#05050a", primary: "#ffffff", secondary: "#ff00aa", mirror: "rgba(255,255,255,0.25)", bpm: 152, length: 6200 }
    ];

    function generateLevelData(levelIdx) {
        const theme = LEVEL_THEMES[levelIdx];
        const obstacles = [];
        const length = theme.length;
        
        let x = 700; // Starting offset
        let currentY = 0; // Ground height offset

        // Deterministic pseudo random seeded by level index
        let seed = levelIdx * 999 + 42;
        function random() {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        while (x < length) {
            const stepType = Math.floor(random() * 10);

            if (stepType < 3) {
                // Single or double spike
                const count = Math.floor(random() * 2) + 1;
                for (let i = 0; i < count; i++) {
                    obstacles.push({ type: 'spike', x: x + i * 40, y: currentY, w: 40, h: 44 });
                }
                x += count * 40 + 180 + random() * 100;
            } else if (stepType < 5) {
                // Block obstacle sequence
                const heightBlocks = Math.floor(random() * 2) + 1;
                const widthBlocks = Math.floor(random() * 3) + 1;
                for (let wb = 0; wb < widthBlocks; wb++) {
                    for (let hb = 0; hb < heightBlocks; hb++) {
                        obstacles.push({ type: 'block', x: x + wb * 40, y: currentY + hb * 40, w: 40, h: 40 });
                    }
                }
                // Spike on top of block option
                if (random() > 0.5) {
                    obstacles.push({ type: 'spike', x: x + 10, y: currentY + heightBlocks * 40, w: 40, h: 44 });
                }
                x += widthBlocks * 40 + 220;
            } else if (stepType < 7) {
                // Jump Pad & High Platform
                obstacles.push({ type: 'pad_yellow', x: x, y: currentY, w: 40, h: 12 });
                // High platform to land
                const platWidth = 4;
                for (let i = 0; i < platWidth; i++) {
                    obstacles.push({ type: 'block', x: x + 180 + i * 40, y: currentY + 120, w: 40, h: 40 });
                }
                obstacles.push({ type: 'spike', x: x + 180 + 40, y: currentY + 160, w: 40, h: 44 });
                x += 180 + platWidth * 40 + 200;
            } else if (stepType < 8) {
                // Jump Ring (Orb in mid-air)
                obstacles.push({ type: 'spike', x: x + 80, y: currentY, w: 40, h: 44 });
                obstacles.push({ type: 'ring_yellow', x: x + 80, y: currentY + 110, w: 36, h: 36 });
                obstacles.push({ type: 'spike', x: x + 120, y: currentY, w: 40, h: 44 });
                x += 320;
            } else {
                // Speed portal or vehicle portal
                if (x > 1200 && x < length - 800 && random() > 0.6) {
                    const portalType = random() > 0.5 ? 'portal_ship' : 'portal_cube';
                    obstacles.push({ type: portalType, x: x, y: currentY + 50, w: 40, h: 90 });
                } else {
                    // Staircase blocks
                    for (let i = 0; i < 3; i++) {
                        obstacles.push({ type: 'block', x: x + i * 40, y: currentY + i * 40, w: 40, h: 40 });
                    }
                }
                x += 300 + random() * 100;
            }
        }

        // Finish line trigger
        obstacles.push({ type: 'finish', x: length, y: 0, w: 60, h: 600 });

        return obstacles;
    }

    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    const previewCanvas = document.getElementById('custom-preview-canvas');
    const previewCtx = previewCanvas.getContext('2d');

    // Graphics Settings
    let maxGraphics = true;

    // Player Skins / Customization State
    const CUSTOM_STATE = {
        primary: "#00f2fe",
        secondary: "#ff007f",
        trail: "glow" // "glow", "particles", "line"
    };

    const COLOR_OPTIONS = ["#00f2fe", "#ff007f", "#00ff66", "#ffbb00", "#bf00ff", "#ffffff", "#ff3300"];

    // Game Core State
    let currentLevelIdx = 0;
    let levelData = [];
    let isPlaying = false;
    let isPaused = false;
    let attemptCount = 1;
    let cameraX = 0;
    let screenShake = 0;

    // Physics Constants
    const GRAVITY = 1.45;
    const JUMP_FORCE = -18.5;
    const PAD_JUMP_FORCE = -24.0;
    const ORB_JUMP_FORCE = -19.5;
    const BASE_SPEED = 9.2;

    // Player Object
    const player = {
        x: 100,
        y: 0,
        w: 42,
        h: 42,
        vy: 0,
        rotation: 0,
        isGrounded: false,
        mode: 'cube', // 'cube' or 'ship'
        holdingJump: false,
        trail: [],
        deathParticles: []
    };

    // Ambient World Particles
    let ambientParticles = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        initAmbientParticles();
    }
    window.addEventListener('resize', resizeCanvas);

    function initAmbientParticles() {
        ambientParticles = [];
        for (let i = 0; i < 60; i++) {
            ambientParticles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 3 + 1,
                vx: (Math.random() - 0.5) * 0.8,
                vy: (Math.random() - 0.5) * 0.8,
                alpha: Math.random() * 0.5 + 0.2
            });
        }
    }

    function getGroundY() {
        return canvas.height * 0.72;
    }

    function drawWorld() {
        const theme = LEVEL_THEMES[currentLevelIdx];
        const groundY = getGroundY();

        // 1. Clear & Background Gradient
        const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        bgGrad.addColorStop(0, theme.bg);
        bgGrad.addColorStop(1, "#020205");
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        // Camera Screen Shake translate
        if (screenShake > 0) {
            const rx = (Math.random() - 0.5) * screenShake;
            const ry = (Math.random() - 0.5) * screenShake;
            ctx.translate(rx, ry);
            screenShake *= 0.88;
            if (screenShake < 0.2) screenShake = 0;
        }

        // 2. Parallax Neon Grid & Background Pillars
        drawBackgroundGrid(theme);

        // 3. Ambient Floating Sparks
        drawAmbientParticles(theme);

        // 4. Main World Rendering Context Shift (Camera offset)
        ctx.save();
        ctx.translate(-cameraX, 0);

        // Render Main Gameplay World
        drawLevelElements(theme, groundY);
        drawPlayer(theme, groundY);

        ctx.restore(); // Restore camera translate for reflection calculation

        // 5. MIRRORING / FLOOR REFLECTION PASS
        if (maxGraphics) {
            drawFloorReflection(theme, groundY);
        }

        // 6. Draw Solid Ground Floor with Glass Highlight
        drawGroundSurface(theme, groundY);

        ctx.restore();
    }

    function drawBackgroundGrid(theme) {
        ctx.save();
        ctx.strokeStyle = theme.primary;
        ctx.globalAlpha = 0.07;
        ctx.lineWidth = 1.5;

        const gridSize = 80;
        const offsetX = (-cameraX * 0.3) % gridSize;

        ctx.beginPath();
        for (let x = offsetX; x < canvas.width; x += gridSize) {
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvas.height);
        }
        for (let y = 0; y < canvas.height; y += gridSize) {
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
        }
        ctx.stroke();
        ctx.restore();
    }

    function drawAmbientParticles(theme) {
        ctx.save();
        ctx.fillStyle = theme.primary;
        ambientParticles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0) p.x = canvas.width;
            if (p.x > canvas.width) p.x = 0;
            if (p.y < 0) p.y = canvas.height;
            if (p.y > canvas.height) p.y = 0;

            ctx.globalAlpha = p.alpha;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.restore();
    }

    function drawLevelElements(theme, groundY) {
        // Only render visible items
        const viewLeft = cameraX - 100;
        const viewRight = cameraX + canvas.width + 100;

        levelData.forEach(obs => {
            if (obs.x + obs.w < viewLeft || obs.x > viewRight) return;

            const renderY = groundY - obs.y - obs.h;

            if (obs.type === 'spike') {
                ctx.save();
                ctx.fillStyle = "#111625";
                ctx.strokeStyle = theme.primary;
                ctx.lineWidth = 3;
                if (maxGraphics) {
                    ctx.shadowColor = theme.primary;
                    ctx.shadowBlur = 12;
                }

                ctx.beginPath();
                ctx.moveTo(obs.x, renderY + obs.h);
                ctx.lineTo(obs.x + obs.w / 2, renderY);
                ctx.lineTo(obs.x + obs.w, renderY + obs.h);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Inner core triangle highlight
                ctx.fillStyle = theme.primary;
                ctx.beginPath();
                ctx.moveTo(obs.x + 12, renderY + obs.h - 4);
                ctx.lineTo(obs.x + obs.w / 2, renderY + 14);
                ctx.lineTo(obs.x + obs.w - 12, renderY + obs.h - 4);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            } else if (obs.type === 'block') {
                ctx.save();
                ctx.fillStyle = "#0c101d";
                ctx.strokeStyle = theme.secondary;
                ctx.lineWidth = 2.5;
                if (maxGraphics) {
                    ctx.shadowColor = theme.secondary;
                    ctx.shadowBlur = 10;
                }

                ctx.fillRect(obs.x, renderY, obs.w, obs.h);
                ctx.strokeRect(obs.x, renderY, obs.w, obs.h);

                // Inner block detail cross
                ctx.globalAlpha = 0.4;
                ctx.beginPath();
                ctx.moveTo(obs.x + 8, renderY + 8);
                ctx.lineTo(obs.x + obs.w - 8, renderY + obs.h - 8);
                ctx.moveTo(obs.x + obs.w - 8, renderY + 8);
                ctx.lineTo(obs.x + 8, renderY + obs.h - 8);
                ctx.stroke();

                ctx.restore();
            } else if (obs.type === 'pad_yellow') {
                ctx.save();
                ctx.fillStyle = "#ffcc00";
                if (maxGraphics) {
                    ctx.shadowColor = "#ffcc00";
                    ctx.shadowBlur = 15;
                }
                ctx.beginPath();
                ctx.roundRect(obs.x, renderY + obs.h - 8, obs.w, 8, 4);
                ctx.fill();
                ctx.restore();
            } else if (obs.type === 'ring_yellow') {
                ctx.save();
                ctx.strokeStyle = "#ffcc00";
                ctx.lineWidth = 4;
                if (maxGraphics) {
                    ctx.shadowColor = "#ffcc00";
                    ctx.shadowBlur = 18;
                }
                ctx.beginPath();
                ctx.arc(obs.x + obs.w / 2, renderY + obs.h / 2, obs.w / 2, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(obs.x + obs.w / 2, renderY + obs.h / 2, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            } else if (obs.type.startsWith('portal')) {
                ctx.save();
                const isShip = obs.type === 'portal_ship';
                const portalColor = isShip ? "#00ff88" : "#bf00ff";
                
                ctx.strokeStyle = portalColor;
                ctx.lineWidth = 4;
                if (maxGraphics) {
                    ctx.shadowColor = portalColor;
                    ctx.shadowBlur = 20;
                }
                ctx.beginPath();
                ctx.ellipse(obs.x + obs.w/2, renderY + obs.h/2, obs.w/2, obs.h/2, 0, 0, Math.PI*2);
                ctx.stroke();
                ctx.restore();
            } else if (obs.type === 'finish') {
                ctx.save();
                ctx.fillStyle = "#00ffcc";
                if (maxGraphics) {
                    ctx.shadowColor = "#00ffcc";
                    ctx.shadowBlur = 30;
                }
                ctx.fillRect(obs.x, renderY, obs.w, obs.h);
                ctx.restore();
            }
        });
    }

    function drawPlayer(theme, groundY) {
        const renderY = groundY - player.y - player.h;

        // Trail rendering
        if (maxGraphics && player.trail.length > 1) {
            ctx.save();
            for (let i = 0; i < player.trail.length - 1; i++) {
                const pt1 = player.trail[i];
                const pt2 = player.trail[i + 1];
                const alpha = (i / player.trail.length) * 0.6;

                ctx.strokeStyle = CUSTOM_STATE.secondary;
                ctx.lineWidth = (i / player.trail.length) * (player.w * 0.7);
                ctx.globalAlpha = alpha;
                ctx.shadowColor = CUSTOM_STATE.secondary;
                ctx.shadowBlur = 10;

                ctx.beginPath();
                ctx.moveTo(pt1.x + player.w / 2, groundY - pt1.y - player.h / 2);
                ctx.lineTo(pt2.x + player.w / 2, groundY - pt2.y - player.h / 2);
                ctx.stroke();
            }
            ctx.restore();
        }

        // Draw Player Body
        ctx.save();
        ctx.translate(player.x + player.w / 2, renderY + player.h / 2);
        ctx.rotate(player.rotation);

        // Glow outer shadow
        if (maxGraphics) {
            ctx.shadowColor = CUSTOM_STATE.primary;
            ctx.shadowBlur = 20;
        }

        if (player.mode === 'cube') {
            // Main Cube Face
            ctx.fillStyle = CUSTOM_STATE.primary;
            ctx.fillRect(-player.w / 2, -player.h / 2, player.w, player.h);

            // Inner Frame Accent
            ctx.strokeStyle = CUSTOM_STATE.secondary;
            ctx.lineWidth = 4;
            ctx.strokeRect(-player.w / 2 + 5, -player.h / 2 + 5, player.w - 10, player.h - 10);

            // Center Eye/Core
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(-player.w / 6, -player.h / 6, player.w / 3, player.h / 3);
        } else {
            // Ship Mode Representation
            ctx.fillStyle = CUSTOM_STATE.primary;
            ctx.beginPath();
            ctx.moveTo(player.w / 2, 0);
            ctx.lineTo(-player.w / 2, -player.h / 2);
            ctx.lineTo(-player.w / 4, 0);
            ctx.lineTo(-player.w / 2, player.h / 2);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = CUSTOM_STATE.secondary;
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        ctx.restore();

        // Death Particles
        if (player.deathParticles.length > 0) {
            ctx.save();
            player.deathParticles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.fillRect(p.x, groundY - p.y, p.size, p.size);
            });
            ctx.restore();
        }
    }

    function drawFloorReflection(theme, groundY) {
        ctx.save();
        
        // Clip to ground area downwards
        ctx.beginPath();
        ctx.rect(0, groundY, canvas.width, canvas.height - groundY);
        ctx.clip();

        // Flip vertically around ground Y plane
        ctx.translate(0, groundY * 2);
        ctx.scale(1, -1);

        // Apply mirror fade and reflection tint
        ctx.globalAlpha = 0.28;

        ctx.translate(-cameraX, 0);
        drawLevelElements(theme, groundY);
        drawPlayer(theme, groundY);

        ctx.restore();

        // Overlay linear gradient mask for deep floor reflection fade
        ctx.save();
        const fadeGrad = ctx.createLinearGradient(0, groundY, 0, canvas.height);
        fadeGrad.addColorStop(0, "rgba(3, 3, 8, 0.3)");
        fadeGrad.addColorStop(0.5, "rgba(3, 3, 8, 0.85)");
        fadeGrad.addColorStop(1, "#030308");
        ctx.fillStyle = fadeGrad;
        ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
        ctx.restore();
    }

    function drawGroundSurface(theme, groundY) {
        ctx.save();
        
        // Ground Fill
        ctx.fillStyle = "#060913";
        ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

        // High Gloss Glass Surface Line
        ctx.strokeStyle = theme.primary;
        ctx.lineWidth = 3;
        if (maxGraphics) {
            ctx.shadowColor = theme.primary;
            ctx.shadowBlur = 15;
        }
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.lineTo(canvas.width, groundY);
        ctx.stroke();

        // Sub-surface grid lines
        ctx.strokeStyle = theme.secondary;
        ctx.lineWidth = 1;
        ctx.globalAlpha = 0.15;
        const gridStep = 40;
        const offsetX = (-cameraX) % gridStep;

        ctx.beginPath();
        for (let x = offsetX; x < canvas.width; x += gridStep) {
            ctx.moveTo(x, groundY);
            ctx.lineTo(x - 100, canvas.height);
        }
        ctx.stroke();

        ctx.restore();
    }

    function updatePhysics() {
        if (!isPlaying || isPaused) return;

        const theme = LEVEL_THEMES[currentLevelIdx];

        // Forward Speed Movement
        player.x += BASE_SPEED;
        cameraX = player.x - canvas.width * 0.22;

        // Save trail history
        player.trail.push({ x: player.x, y: player.y });
        if (player.trail.length > 18) player.trail.shift();

        if (player.mode === 'cube') {
            // Apply Gravity
            player.vy += GRAVITY;
            player.y -= player.vy;

            // Rotation Logic
            if (!player.isGrounded) {
                player.rotation += 0.15;
            } else {
                // Snap rotation to nearest 90 degrees on land
                const snap = Math.round(player.rotation / (Math.PI / 2)) * (Math.PI / 2);
                player.rotation += (snap - player.rotation) * 0.3;
            }
        } else if (player.mode === 'ship') {
            // Ship thrust mechanics
            if (player.holdingJump) {
                player.vy -= 0.8;
            } else {
                player.vy += 0.8;
            }
            player.vy *= 0.94; // Drag
            player.y -= player.vy;

            // Ship rotation follows vertical velocity
            player.rotation = Math.atan2(-player.vy, BASE_SPEED);
        }

        // Floor Collision
        if (player.y <= 0) {
            player.y = 0;
            player.vy = 0;
            player.isGrounded = true;

            if (player.holdingJump && player.mode === 'cube') {
                triggerJump();
            }
        } else {
            player.isGrounded = false;
        }

        // Ceiling Boundary Limit
        if (player.y > canvas.height * 0.65) {
            player.y = canvas.height * 0.65;
            player.vy = 0;
        }

        // Check Obstacle Collisions
        checkCollisions();

        // Update HUD Percentage Progress
        const percent = Math.min(100, Math.floor((player.x / theme.length) * 100));
        document.getElementById('hud-percent').innerText = `${percent}%`;
        document.getElementById('hud-progress-bar').style.width = `${percent}%`;

        // Update Death Particles if active
        if (player.deathParticles.length > 0) {
            player.deathParticles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
            });
            player.deathParticles = player.deathParticles.filter(p => p.alpha > 0);
        }
    }

    function triggerJump() {
        if (player.isGrounded && player.mode === 'cube') {
            player.vy = JUMP_FORCE;
            player.isGrounded = false;
            audio.playJump();
        }
    }

    function checkCollisions() {
        const pRect = {
            left: player.x + 6,
            right: player.x + player.w - 6,
            bottom: player.y,
            top: player.y + player.h - 4
        };

        levelData.forEach(obs => {
            const oRect = {
                left: obs.x,
                right: obs.x + obs.w,
                bottom: obs.y,
                top: obs.y + obs.h
            };

            // AABB Collision test
            if (pRect.right > oRect.left && pRect.left < oRect.right &&
                pRect.top > oRect.bottom && pRect.bottom < oRect.top) {

                if (obs.type === 'spike') {
                    triggerDeath();
                } else if (obs.type === 'block') {
                    // Landing on top of block vs hitting side
                    const prevBottom = player.y + player.vy;
                    if (prevBottom >= oRect.top - 6) {
                        // Landed on block top
                        player.y = oRect.top;
                        player.vy = 0;
                        player.isGrounded = true;
                        if (player.holdingJump && player.mode === 'cube') {
                            triggerJump();
                        }
                    } else {
                        // Crash into side of block
                        triggerDeath();
                    }
                } else if (obs.type === 'pad_yellow') {
                    player.vy = PAD_JUMP_FORCE;
                    player.isGrounded = false;
                    audio.playPad();
                } else if (obs.type === 'ring_yellow' && player.holdingJump) {
                    player.vy = ORB_JUMP_FORCE;
                    player.isGrounded = false;
                    audio.playOrb();
                } else if (obs.type === 'portal_ship') {
                    player.mode = 'ship';
                } else if (obs.type === 'portal_cube') {
                    player.mode = 'cube';
                } else if (obs.type === 'finish') {
                    triggerVictory();
                }
            }
        });
    }

    function triggerDeath() {
        if (!isPlaying) return;
        isPlaying = false;
        screenShake = 25;
        audio.playDeath();

        // Spawn Shatter Particles
        for (let i = 0; i < 30; i++) {
            player.deathParticles.push({
                x: player.x + player.w / 2,
                y: player.y + player.h / 2,
                vx: (Math.random() - 0.5) * 16,
                vy: (Math.random() - 0.5) * 16,
                size: Math.random() * 8 + 4,
                color: Math.random() > 0.5 ? CUSTOM_STATE.primary : CUSTOM_STATE.secondary,
                alpha: 1.0
            });
        }

        const theme = LEVEL_THEMES[currentLevelIdx];
        const percent = Math.min(100, Math.floor((player.x / theme.length) * 100));

        // Save highscore percentage
        const savedBest = localStorage.getItem(`level_best_${currentLevelIdx}`) || 0;
        if (percent > savedBest) {
            localStorage.setItem(`level_best_${currentLevelIdx}`, percent);
        }

        document.getElementById('death-percent-text').innerText = `${percent}% COMPLETED`;

        setTimeout(() => {
            document.getElementById('screen-game-over').classList.remove('hidden');
        }, 400);
    }

    function triggerVictory() {
        isPlaying = false;
        audio.playVictory();

        // Save progress stars
        localStorage.setItem(`level_best_${currentLevelIdx}`, 100);
        updateStarsCount();

        document.getElementById('victory-attempts').innerText = `ATTEMPTS: ${attemptCount}`;
        document.getElementById('screen-victory').classList.remove('hidden');
    }

    function startLevel(levelIdx) {
        currentLevelIdx = levelIdx;
        levelData = generateLevelData(levelIdx);

        // Reset player state
        player.x = 100;
        player.y = 0;
        player.vy = 0;
        player.rotation = 0;
        player.mode = 'cube';
        player.isGrounded = true;
        player.trail = [];
        player.deathParticles = [];

        attemptCount = 1;
        isPlaying = true;
        isPaused = false;

        // Update UI
        const theme = LEVEL_THEMES[levelIdx];
        document.getElementById('hud-level-title').innerText = `LEVEL ${levelIdx + 1}: ${theme.name}`;
        document.getElementById('hud-attempt').innerText = attemptCount;
        document.getElementById('hud-percent').innerText = "0%";
        document.getElementById('hud-progress-bar').style.width = "0%";

        // Show HUD / Hide Menus
        document.getElementById('hud').classList.remove('opacity-0');
        document.getElementById('hud-progress-container').classList.remove('opacity-0');
        document.getElementById('screen-main-menu').classList.add('hidden');
        document.getElementById('screen-game-over').classList.add('hidden');
        document.getElementById('screen-victory').classList.add('hidden');
        document.getElementById('screen-pause').classList.add('hidden');

        // Start BGM Synth
        audio.startBGM(theme.bpm, theme.primary);
    }

    function restartLevel() {
        attemptCount++;
        player.x = 100;
        player.y = 0;
        player.vy = 0;
        player.rotation = 0;
        player.mode = 'cube';
        player.isGrounded = true;
        player.trail = [];
        player.deathParticles = [];

        isPlaying = true;
        isPaused = false;

        document.getElementById('hud-attempt').innerText = attemptCount;
        document.getElementById('screen-game-over').classList.add('hidden');
        document.getElementById('screen-pause').classList.add('hidden');

        const theme = LEVEL_THEMES[currentLevelIdx];
        audio.startBGM(theme.bpm, theme.primary);
    }

    function renderLevelSelector() {
        const grid = document.getElementById('level-grid');
        grid.innerHTML = '';

        LEVEL_THEMES.forEach((theme, idx) => {
            const bestPercent = localStorage.getItem(`level_best_${idx}`) || 0;
            const card = document.createElement('div');
            card.className = `level-card glass-panel p-4 rounded-2xl border border-white/10 cursor-pointer flex flex-col justify-between relative overflow-hidden`;

            card.innerHTML = `
                <div class="flex justify-between items-start mb-2">
                    <span class="orbitron text-xs font-bold px-2.5 py-0.5 rounded-full bg-cyan-500/20 text-cyan-400 border border-cyan-500/30">
                        LVL ${idx + 1}
                    </span>
                    <span class="orbitron text-xs font-bold text-yellow-400">
                        ★ ${theme.stars}
                    </span>
                </div>

                <div class="my-2">
                    <h3 class="orbitron font-black text-base text-white tracking-wide uppercase">${theme.name}</h3>
                    <p class="orbitron text-xs font-bold text-gray-400 tracking-wider">${theme.difficulty}</p>
                </div>

                <div class="mt-3">
                    <div class="flex justify-between text-xs orbitron font-bold mb-1">
                        <span class="text-gray-400">BEST</span>
                        <span class="${bestPercent == 100 ? 'text-emerald-400' : 'text-cyan-400'}">${bestPercent}%</span>
                    </div>
                    <div class="h-1.5 w-full bg-gray-800 rounded-full overflow-hidden">
                        <div class="h-full bg-gradient-to-r from-cyan-400 to-pink-500" style="width: ${bestPercent}%"></div>
                    </div>
                </div>
            `;

            card.addEventListener('click', () => startLevel(idx));
            grid.appendChild(card);
        });

        updateStarsCount();
    }

    function updateStarsCount() {
        let totalStars = 0;
        LEVEL_THEMES.forEach((theme, idx) => {
            const best = localStorage.getItem(`level_best_${idx}`) || 0;
            if (parseInt(best) === 100) {
                totalStars += theme.stars;
            }
        });
        document.getElementById('stars-count').innerText = totalStars;
    }

    function initCustomizationUI() {
        const primContainer = document.getElementById('primary-colors');
        const secContainer = document.getElementById('secondary-colors');
        primContainer.innerHTML = '';
        secContainer.innerHTML = '';

        COLOR_OPTIONS.forEach(color => {
            // Primary Color Dots
            const btnP = document.createElement('button');
            btnP.className = `w-9 h-9 rounded-full border-2 transition-transform hover:scale-110 ${CUSTOM_STATE.primary === color ? 'border-white scale-110 shadow-[0_0_10px_white]' : 'border-transparent'}`;
            btnP.style.backgroundColor = color;
            btnP.addEventListener('click', () => {
                CUSTOM_STATE.primary = color;
                initCustomizationUI();
                drawPreviewCube();
            });
            primContainer.appendChild(btnP);

            // Secondary Color Dots
            const btnS = document.createElement('button');
            btnS.className = `w-9 h-9 rounded-full border-2 transition-transform hover:scale-110 ${CUSTOM_STATE.secondary === color ? 'border-white scale-110 shadow-[0_0_10px_white]' : 'border-transparent'}`;
            btnS.style.backgroundColor = color;
            btnS.addEventListener('click', () => {
                CUSTOM_STATE.secondary = color;
                initCustomizationUI();
                drawPreviewCube();
            });
            secContainer.appendChild(btnS);
        });

        drawPreviewCube();
    }

    function drawPreviewCube() {
        previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
        const w = 50, h = 50;
        const x = (previewCanvas.width - w) / 2;
        const y = (previewCanvas.height - h) / 2;

        previewCtx.fillStyle = CUSTOM_STATE.primary;
        previewCtx.fillRect(x, y, w, h);

        previewCtx.strokeStyle = CUSTOM_STATE.secondary;
        previewCtx.lineWidth = 4;
        previewCtx.strokeRect(x + 5, y + 5, w - 10, h - 10);

        previewCtx.fillStyle = "#ffffff";
        previewCtx.fillRect(x + w / 2 - 8, y + h / 2 - 8, 16, 16);
    }

    function handleJumpStart() {
        if (!isPlaying) return;
        player.holdingJump = true;
        triggerJump();
    }

    function handleJumpEnd() {
        player.holdingJump = false;
    }

    // Keyboard bindings
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
            e.preventDefault();
            handleJumpStart();
        }
        if (e.code === 'KeyP' || e.code === 'Escape') {
            if (isPlaying) togglePause();
        }
    });

    window.addEventListener('keyup', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
            handleJumpEnd();
        }
    });

    // Touch & Mouse bindings
    canvas.addEventListener('mousedown', handleJumpStart);
    canvas.addEventListener('mouseup', handleJumpEnd);
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        handleJumpStart();
    }, { passive: false });
    canvas.addEventListener('touchend', handleJumpEnd);

    // Pause UI Control Actions
    function togglePause() {
        isPaused = !isPaused;
        if (isPaused) {
            document.getElementById('screen-pause').classList.remove('hidden');
            audio.stopBGM();
        } else {
            document.getElementById('screen-pause').classList.add('hidden');
            const theme = LEVEL_THEMES[currentLevelIdx];
            audio.startBGM(theme.bpm, theme.primary);
        }
    }

    document.getElementById('btn-hud-pause').addEventListener('click', togglePause);
    document.getElementById('btn-resume').addEventListener('click', togglePause);
    document.getElementById('btn-restart').addEventListener('click', restartLevel);
    document.getElementById('btn-retry').addEventListener('click', restartLevel);

    document.getElementById('btn-exit-menu').addEventListener('click', returnToMainMenu);
    document.getElementById('btn-death-menu').addEventListener('click', returnToMainMenu);
    document.getElementById('btn-victory-menu').addEventListener('click', returnToMainMenu);

    document.getElementById('btn-next-level').addEventListener('click', () => {
        if (currentLevelIdx < LEVEL_THEMES.length - 1) {
            startLevel(currentLevelIdx + 1);
        } else {
            returnToMainMenu();
        }
    });

    function returnToMainMenu() {
        isPlaying = false;
        isPaused = false;
        audio.stopBGM();

        document.getElementById('hud').classList.add('opacity-0');
        document.getElementById('hud-progress-container').classList.add('opacity-0');
        document.getElementById('screen-main-menu').classList.remove('hidden');
        document.getElementById('screen-pause').classList.add('hidden');
        document.getElementById('screen-game-over').classList.add('hidden');
        document.getElementById('screen-victory').classList.add('hidden');

        renderLevelSelector();
    }

    // Customization Screen Toggle
    document.getElementById('btn-open-customize').addEventListener('click', () => {
        document.getElementById('screen-customize').classList.remove('hidden');
        initCustomizationUI();
    });
    document.getElementById('btn-close-customize').addEventListener('click', () => {
        document.getElementById('screen-customize').classList.add('hidden');
    });

    // Audio SFX Toggle
    document.getElementById('btn-toggle-sfx').addEventListener('click', () => {
        audio.enabled = !audio.enabled;
        const icon = document.getElementById('sfx-icon');
        const btn = document.getElementById('btn-toggle-sfx');
        if (audio.enabled) {
            btn.innerHTML = `🔊 AUDIO: ON`;
            if (isPlaying && !isPaused) audio.startBGM(LEVEL_THEMES[currentLevelIdx].bpm);
        } else {
            btn.innerHTML = `MUTE AUDIO: OFF`;
            audio.stopBGM();
        }
    });

    // Graphics Settings Toggle
    document.getElementById('btn-toggle-graphics').addEventListener('click', () => {
        maxGraphics = !maxGraphics;
        const btn = document.getElementById('btn-toggle-graphics');
        btn.innerHTML = maxGraphics ? `✨ BLOOM & MIRROR: MAX` : `⚡ GRAPHICS: FAST`;
    });

    function gameLoop() {
        updatePhysics();
        drawWorld();
        requestAnimationFrame(gameLoop);
    }

    // Startup Initialization
    window.onload = function() {
        resizeCanvas();
        renderLevelSelector();
        gameLoop();
    };
    </script>
</body>
</html>
